[package]
name = "linux-headers"
version = "6.16.1"
description = "The kernel headers glibc is built against"
license = "GPL-2.0-only WITH Linux-syscall-note"
arch = ["x86_64"]

[source]
url = "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.16.1.tar.xz"
sha256 = "ea43491bc7ace1e414b3b2d957f8cf96e7049155123f0acce798accf8da1acba"

[build]
# glibc 2.42 does not build with the headers of 7.x (OPEN_TREE_CLONE is defined twice), so the
# headers are older than the kernel
build = '''
make mrproper
make headers
find usr/include -type f ! -name '*.h' -delete
'''
install = '''
install -d "$DESTDIR/usr"
cp -r usr/include "$DESTDIR/usr/"
'''
