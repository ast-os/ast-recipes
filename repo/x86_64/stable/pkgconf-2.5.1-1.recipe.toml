[package]
name = "pkgconf"
version = "2.5.1"
description = "Compiler flags for libraries"
license = "ISC"
arch = ["x86_64"]

[source]
url = "https://distfiles.ariadne.space/pkgconf/pkgconf-2.5.1.tar.xz"
sha256 = "cd05c9589b9f86ecf044c10a2269822bc9eb001eced2582cfffd658b0a50c243"

[build]
style = "gnu"
configure = ["--disable-static"]
fixup = '''
ln -sf pkgconf "$DESTDIR/usr/bin/pkg-config"
'''
