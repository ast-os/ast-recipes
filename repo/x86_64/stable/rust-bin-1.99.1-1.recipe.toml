[package]
name = "rust-bin"
version = "1.99.1"
description = "The Rust compiler and cargo, from the official binary release (the bootstrap of everything written in Rust)"
license = "MIT OR Apache-2.0"
arch = ["x86_64"]
depends = ["glibc", "gcc"]

[source]
url = "https://static.rust-lang.org/dist/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7"

[build]
build = '''
true
'''
install = '''
./install.sh --prefix=/usr --destdir="$DESTDIR" --disable-ldconfig --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu
'''
fixup = '''
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man" "$DESTDIR/usr/lib/rustlib/uninstall.sh" "$DESTDIR/usr/lib/rustlib/install.log"
'''
