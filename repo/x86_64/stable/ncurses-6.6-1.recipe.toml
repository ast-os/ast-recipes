[package]
name = "ncurses"
version = "6.6"
description = "Terminal handling library"
license = "MIT"
arch = ["x86_64"]

[source]
url = "https://ftpmirror.gnu.org/ncurses/ncurses-6.6.tar.gz"
sha256 = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"

[build]
style = "gnu"
configure = ["--with-shared", "--without-debug", "--without-normal", "--with-cxx-shared", "--enable-pc-files", "--with-pkg-config-libdir=/usr/lib/pkgconfig"]
install = '''
make DESTDIR="$DESTDIR" install
sed -e 's/^#if.*XOPEN.*$/#if 1/' -i "$DESTDIR/usr/include/curses.h"
for lib in ncurses form panel menu; do
    ln -sf lib${lib}w.so "$DESTDIR/usr/lib/lib${lib}.so"
    ln -sf ${lib}w.pc "$DESTDIR/usr/lib/pkgconfig/${lib}.pc"
done
ln -sf libncursesw.so "$DESTDIR/usr/lib/libcurses.so"
'''
