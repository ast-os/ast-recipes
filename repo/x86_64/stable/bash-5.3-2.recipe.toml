[package]
name = "bash"
version = "5.3"
description = "The GNU shell"
license = "GPL-3.0-or-later"
revision = 2
arch = ["x86_64"]
depends = ["readline", "ncurses"]

[source]
url = "https://ftpmirror.gnu.org/bash/bash-5.3.tar.gz"
sha256 = "0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba"

[build]
style = "gnu"
configure = ["--without-bash-malloc", "--with-installed-readline"]
fixup = '''
ln -sf bash "$DESTDIR/usr/bin/sh"
'''
