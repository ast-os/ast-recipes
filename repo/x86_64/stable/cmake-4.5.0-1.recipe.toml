[package]
name = "cmake"
version = "4.5.0"
description = "Cross-platform build system generator"
license = "BSD-3-Clause"
arch = ["x86_64"]
depends = ["zlib", "xz", "zstd"]
build_depends = ["gcc", "make"]

[source]
url = "https://github.com/Kitware/CMake/releases/download/v4.5.0/cmake-4.5.0.tar.gz"
sha256 = "424352d6133e8455e020da787008e8dc67abb18820af3532572ab35657e49213"

[build]
build = '''
./bootstrap --prefix=/usr --parallel="$JOBS" --mandir=/share/man --docdir=/share/doc/cmake -- -DCMAKE_USE_OPENSSL=OFF
make -j"$JOBS"
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
fixup = '''
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/cmake-4.5/Help"
'''
