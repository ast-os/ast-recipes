[package]
name = "grep"
version = "3.12"
description = "Pattern matching"
license = "GPL-3.0-or-later"
arch = ["x86_64"]

[source]
url = "https://ftpmirror.gnu.org/grep/grep-3.12.tar.xz"
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"

[build]
style = "gnu"
# egrep and fgrep print a warning about being obsolete; they stay, quietly
prepare = '''
sed -i "s/echo/#echo/" src/egrep.sh
'''
