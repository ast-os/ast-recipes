[package]
name = "binutils"
version = "2.45"
description = "Assembler, linker and binary tools"
license = "GPL-3.0-or-later"
arch = ["x86_64"]

[source]
url = "https://ftpmirror.gnu.org/binutils/binutils-2.45.tar.xz"
sha256 = "c50c0e7f9cb188980e2cc97e4537626b1672441815587f1eab69d2a1bfbef5d2"

[build]
style = "gnu"
configure = ["--enable-ld=default", "--enable-plugins", "--enable-shared", "--disable-werror", "--enable-64-bit-bfd", "--enable-new-dtags", "--enable-default-hash-style=gnu"]
make = ["tooldir=/usr"]
install_args = ["tooldir=/usr"]
out_of_tree = true
fixup = '''
rm -rf "$DESTDIR"/usr/lib/lib{bfd,ctf,ctf-nobfd,gprofng,opcodes,sframe}.a "$DESTDIR/usr/share/doc/gprofng"
'''
