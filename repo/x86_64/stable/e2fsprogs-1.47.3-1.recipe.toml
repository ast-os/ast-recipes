[package]
name = "e2fsprogs"
version = "1.47.3"
description = "ext2/3/4 tools"
license = "GPL-2.0-only"
arch = ["x86_64"]
depends = ["util-linux"]

[source]
url = "https://downloads.sourceforge.net/project/e2fsprogs/e2fsprogs/v1.47.3/e2fsprogs-1.47.3.tar.gz"
sha256 = "2f5164e64dd7d91eadd1e0e8a77d92c06dd7837bb19f1d9189ce1939b363d2b4"

[build]
style = "gnu"
configure = ["--enable-elf-shlibs", "--disable-libblkid", "--disable-libuuid", "--disable-uuidd", "--disable-fsck"]
out_of_tree = true
fixup = '''
rm -f "$DESTDIR"/usr/lib/{libcom_err,libe2p,libext2fs,libss}.a
'''
