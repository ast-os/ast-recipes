[package]
name = "kbd"
version = "2.8.0"
description = "Keyboard and console tools"
license = "GPL-2.0-or-later"
revision = 2
arch = ["x86_64"]

[source]
url = "https://www.kernel.org/pub/linux/utils/kbd/kbd-2.8.0.tar.xz"
sha256 = "01f5806da7d1d34f594b7b2a6ae1ab23215344cf1064e8edcd3a90fef9776a11"

[build]
style = "gnu"
configure = ["--disable-vlock"]
fixup = '''
rm -f "$DESTDIR/usr/bin/resizecons" "$DESTDIR/usr/share/man/man8/resizecons.8"
'''
