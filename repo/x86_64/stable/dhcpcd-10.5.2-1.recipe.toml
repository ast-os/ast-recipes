[package]
name = "dhcpcd"
version = "10.5.2"
description = "DHCP and IPv6 client"
license = "BSD-2-Clause"
arch = ["x86_64"]
depends = ["glibc"]
config_files = ["/etc/orchid/services/dhcpcd.toml"]

[source]
url = "https://github.com/NetworkConfiguration/dhcpcd/releases/download/v10.5.2/dhcpcd-10.5.2.tar.xz"
sha256 = "3e476657fdb6eeb38b277da3a48d0ac0113ecce5858ebdcddff2b629faed52b4"

[build]
style = "gnu"
configure = ["--runstatedir=/run", "--dbdir=/var/lib/dhcpcd", "--disable-privsep"]
fixup = '''
install -d "$DESTDIR/etc/orchid/services"
cat > "$DESTDIR/etc/orchid/services/dhcpcd.toml" <<'SERVICE'
[service]
description = "configure the network by DHCP"
exec = ["/usr/sbin/dhcpcd", "--nobackground", "--quiet"]
after = ["loopback", "udev-settle"]
restart = "on-failure"
SERVICE
'''
