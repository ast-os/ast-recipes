[package]
name = "python-packaging"
description = "Python package version handling"
license = "Apache-2.0"
arch = ["x86_64"]
depends = ["python"]

[source]
git = "https://github.com/pypa/packaging"
commit = "929fd4b1410ac7ef61ef3f45b2f5d7e87711a9b5"

[build]
build = '''
true
'''
install = '''
site="$DESTDIR/usr/lib/python3.13/site-packages"
mkdir -p "$site"
cp -r src/packaging "$site/"
'''
