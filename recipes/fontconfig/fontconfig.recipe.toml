[package]
name = "fontconfig"
version = "2.18.3"
description = "Font configuration"
license = "MIT"
arch = ["x86_64"]
depends = ["freetype", "expat", "util-linux"]

[source]
git = "https://gitlab.freedesktop.org/fontconfig/fontconfig"
commit = "0f236723a3c26bd9745e32ba2b3ee21e5f809295"

[build]
style = "meson"
configure = ["-Ddoc=disabled", "-Dtests=disabled", "-Dnls=enabled"]
