[package]
name = "linux"
version = "7.3.4"
revision = 2
description = "The Linux kernel and its modules"
license = "GPL-2.0-only"
arch = ["x86_64"]
depends = ["kmod"]

[source]
git = "https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
commit = "7595a62d45ee1a2297eafa5f2ef5d0a45142d84d"

[build]
build = '''
make defconfig
cat > asteros.cfg <<'CFG'
CONFIG_LOCALVERSION=""
# CONFIG_LOCALVERSION_AUTO is not set
CONFIG_MODULES=y
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_TMPFS=y
CONFIG_EXT4_FS=y
CONFIG_ISO9660_FS=y
CONFIG_SQUASHFS=y
CONFIG_OVERLAY_FS=y
CONFIG_BLK_DEV_LOOP=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_FHANDLE=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
# containers and the build sandbox (bubblewrap)
CONFIG_NAMESPACES=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_IPC_NS=y
CONFIG_UTS_NS=y
CONFIG_CGROUPS=y
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# btrfs for the root, FAT for the ESP, built in: there is no initramfs on an installed system
CONFIG_BTRFS_FS=y
CONFIG_BTRFS_FS_POSIX_ACL=y
CONFIG_VFAT_FS=y
CONFIG_FAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_NLS_UTF8=y
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_EFIVAR_FS=y
CONFIG_ZSTD_COMPRESS=y
CONFIG_ZSTD_DECOMPRESS=y
CONFIG_XXHASH=y
CONFIG_CRYPTO_XXHASH=y
CONFIG_CRYPTO_CRC32C=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_BLAKE2B=y
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_FB_EFI=y

# the live system finds its ISO on whatever the stick is (Ventoy: exFAT, NTFS, ext4) without modules
CONFIG_EXFAT_FS=y
CONFIG_NTFS3_FS=y
CONFIG_UDF_FS=y
CONFIG_ISO9660_FS=y
CONFIG_JOLIET=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_BLK_DEV_SR=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_BLK_DEV_NVME=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_PCI=y
CONFIG_USB_OHCI_HCD=y
CONFIG_USB_OHCI_HCD_PCI=y
CONFIG_USB_UHCI_HCD=y
CONFIG_USB_STORAGE=y
CONFIG_USB_UAS=y
CONFIG_HID_GENERIC=y
CONFIG_USB_HID=y
CONFIG_MAGIC_SYSRQ=y

# a text console on the screen of a UEFI machine: the firmware's framebuffer through simpledrm, drawn by fbcon
CONFIG_FB=y
CONFIG_FB_EFI=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_DRM_SIMPLEDRM=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_BOCHS=y

# graphics: the kernel drivers are modules (udev loads them by their PCI ids), the firmware is
# the linux-firmware package; zstd and xz compressed firmware files load as they are
CONFIG_DRM=y
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMDGPU_SI=y
CONFIG_DRM_AMDGPU_CIK=y
CONFIG_DRM_AMD_DC=y
CONFIG_DRM_RADEON=m
CONFIG_DRM_NOUVEAU=m
CONFIG_DRM_I915=m
CONFIG_DRM_XE=m
CONFIG_DRM_VIRTIO_GPU=m
CONFIG_DRM_VMWGFX=m
CONFIG_DRM_QXL=m
CONFIG_DRM_CIRRUS_QEMU=m
CONFIG_FW_LOADER=y
CONFIG_FW_LOADER_COMPRESS=y
CONFIG_FW_LOADER_COMPRESS_XZ=y
CONFIG_FW_LOADER_COMPRESS_ZSTD=y
CONFIG_VGA_SWITCHEROO=y
CONFIG_INPUT_EVDEV=y
CONFIG_INPUT_MOUSEDEV=y
CONFIG_INPUT_UINPUT=m
CONFIG_HID_MULTITOUCH=m
CONFIG_I2C_HID_ACPI=m
CFG
scripts/kconfig/merge_config.sh -m .config asteros.cfg
make olddefconfig
make -j"$JOBS"
'''
install = '''
make INSTALL_MOD_PATH="$DESTDIR/usr" modules_install
install -Dm644 arch/x86/boot/bzImage "$DESTDIR/boot/vmlinuz-7.3.4"
install -Dm644 System.map "$DESTDIR/boot/System.map-7.3.4"
install -Dm644 .config "$DESTDIR/boot/config-7.3.4"
rm -f "$DESTDIR"/usr/lib/modules/7.3.4/{build,source}
'''
