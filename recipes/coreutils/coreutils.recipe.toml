[package]
name = "coreutils"
version = "9.7"
description = "Basic file, shell and text utilities"
license = "GPL-3.0-or-later"
arch = ["x86_64"]
depends = ["acl", "attr", "libcap"]

[source]
url = "https://ftpmirror.gnu.org/coreutils/coreutils-9.7.tar.xz"
sha256 = "e8bb26ad0293f9b5a1fc43fb42ba970e312c66ce92c1b0b16713d7500db251bf"

[build]
style = "gnu"
configure = ["FORCE_UNSAFE_CONFIGURE=1", "--enable-no-install-program=kill,uptime"]
fixup = '''
mkdir -p "$DESTDIR/usr/sbin"; mv "$DESTDIR/usr/bin/chroot" "$DESTDIR/usr/sbin/"
'''
