[package]
name = "libxrandr"
version = "1.5.5"
description = "XRandR"
license = "MIT"
arch = ["x86_64"]
depends = ["libxext", "libxrender"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXrandr"
commit = "540c3ceef2be3e513b18002a858c7a9591dd749a"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
