[package]
name = "xz"
version = "5.8.1"
description = "XZ compression"
license = "0BSD"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext"]

[source]
git = "https://github.com/tukaani-project/xz"
commit = "a522a226545730551f7e7c2685fab27cf567746c"

[build]
style = "gnu"
prepare = '''
./autogen.sh --no-po4a
'''
configure = ["--disable-static"]
