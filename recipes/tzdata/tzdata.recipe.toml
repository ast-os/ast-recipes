[package]
name = "tzdata"
version = "2025b"
description = "Time zone database"
license = "LicenseRef-Public-Domain"
arch = ["x86_64"]

[source]
url = "https://www.iana.org/time-zones/repository/releases/tzdata2025b.tar.gz"
sha256 = "11810413345fc7805017e27ea9fa4885fd74cd61b2911711ad038f5d28d71474"
strip = 0

[build]
build = '''
true
'''
install = '''
ZONEINFO="$DESTDIR/usr/share/zoneinfo"
mkdir -p "$ZONEINFO"/{posix,right}
for tz in etcetera southamerica northamerica europe africa antarctica asia australasia backward; do
    zic -L /dev/null -d "$ZONEINFO" ${tz}
    zic -L /dev/null -d "$ZONEINFO/posix" ${tz}
    zic -L leapseconds -d "$ZONEINFO/right" ${tz}
done
cp zone.tab zone1970.tab iso3166.tab "$ZONEINFO"
zic -d "$ZONEINFO" -p America/New_York
'''
