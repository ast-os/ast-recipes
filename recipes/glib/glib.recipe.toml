[package]
name = "glib"
version = "2.90.1"
description = "Core application library"
license = "LGPL-2.1-or-later"
arch = ["x86_64"]
depends = ["libffi", "pcre2", "zlib", "util-linux", "python"]

[source]
url = "https://download.gnome.org/sources/glib/2.90/glib-2.90.1.tar.xz"
sha256 = "93c941aa17d5eb1d53fe838365f29a8b4e539c222a256d974ec8f30fc413e396"

[build]
style = "meson"
configure = ["-Dtests=false", "-Dintrospection=disabled", "-Dman-pages=disabled", "-Ddocumentation=false", "-Dsysprof=disabled", "-Dlibmount=enabled", "-Dselinux=disabled", "-Dnls=enabled", "-Dglib_debug=disabled"]
