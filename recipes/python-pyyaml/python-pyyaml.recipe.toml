[package]
name = "python-pyyaml"
description = "YAML parser"
license = "MIT"
arch = ["x86_64"]
depends = ["python"]

[source]
git = "https://github.com/yaml/pyyaml"
commit = "49790e73684bebad1df05ef8d828fa12f685bffb"

[build]
build = '''
true
'''
install = '''
site="$DESTDIR/usr/lib/python3.13/site-packages"
mkdir -p "$site"
cp -r lib/yaml "$site/"
'''
