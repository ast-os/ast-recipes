[package]
name = "libpng"
version = "1.6.59"
description = "PNG library"
license = "Libpng-2.0"
arch = ["x86_64"]
depends = ["zlib"]
build_depends = ["cmake"]

[source]
git = "https://github.com/pnggroup/libpng"
commit = "cd952f49f95bb27154ae77dbb103032d95f6e580"

[build]
style = "cmake"
configure = ["-DPNG_STATIC=OFF", "-DPNG_TESTS=OFF", "-DPNG_FRAMEWORK=OFF"]
