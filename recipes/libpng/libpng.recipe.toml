[package]
name = "libpng"
version = "1.6.59"
description = "PNG library"
license = "Libpng-2.0"
arch = ["x86_64"]
depends = ["zlib"]
build_depends = ["cmake"]

[source]
url = "https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.59.tar.gz"
sha256 = "2540302a1844ad2b2b501977abecfa850f265f97b78f065a712ab4074a89f5b5"

[build]
style = "cmake"
configure = ["-DPNG_STATIC=OFF", "-DPNG_TESTS=OFF", "-DPNG_FRAMEWORK=OFF"]
