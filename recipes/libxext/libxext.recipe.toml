[package]
name = "libxext"
version = "1.3.7"
description = "X extensions"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11"]

[source]
url = "https://www.x.org/releases/individual/lib/libXext-1.3.7.tar.xz"
sha256 = "6c643c7035cdacf67afd68f25d01b90ef889d546c9fcd7c0adf7c2cf91e3a32d"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
