[package]
name = "libxext"
version = "1.3.7"
description = "X extensions"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXext"
commit = "2a694ba264ccdb205909909abfe8b136f9156ebe"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
