[package]
name = "libfontenc"
version = "1.1.9"
description = "Font encodings"
license = "MIT"
arch = ["x86_64"]
depends = ["zlib", "xorgproto"]
build_depends = ["font-util", "util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libfontenc"
commit = "780d1f6f192a331de7b298a96e23ebc44d2a884b"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
