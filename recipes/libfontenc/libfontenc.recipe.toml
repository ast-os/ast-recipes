[package]
name = "libfontenc"
version = "1.1.9"
description = "Font encodings"
license = "MIT"
arch = ["x86_64"]
depends = ["zlib", "xorgproto"]

[source]
url = "https://www.x.org/releases/individual/lib/libfontenc-1.1.9.tar.xz"
sha256 = "9d8392705cb10803d5fe1d27d236cbab3f664e26841ce01916bbbe430cf273e2"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
