[package]
name = "xorg-server"
description = "The X.Org X server"
license = "MIT"
arch = ["x86_64"]
depends = ["libdrm", "mesa", "libepoxy", "pixman", "libxfont2", "libxkbfile", "libxcvt", "libpciaccess", "xkbcomp", "xkeyboard-config", "eudev", "libxau", "libxdmcp", "xorgproto", "xtrans", "libxshmfence", "libx11", "libxext"]

[source]
git = "https://gitlab.freedesktop.org/xorg/xserver"
commit = "7dbd8d0dd1929c2011009fd1770c8aa470df97fb"

[build]
style = "meson"
configure = ["-Dxorg=true", "-Dsecure-rpc=false", "-Dxnest=false", "-Dxvfb=false", "-Dglamor=true", "-Dsystemd_logind=false", "-Dudev=true", "-Dudev_kms=true", "-Dxkb_dir=/usr/share/X11/xkb", "-Dxkb_output_dir=/var/lib/xkb", "-Dsuid_wrapper=false", "-Ddocs=false", "-Ddevel-docs=false"]
