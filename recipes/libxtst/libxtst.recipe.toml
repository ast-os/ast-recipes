[package]
name = "libxtst"
version = "1.2.6"
description = "XTest and RECORD"
license = "MIT"
arch = ["x86_64"]
depends = ["libxext", "libxi"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXtst"
commit = "b95aac652cd77f66c4b472aa840b30c337b77715"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
