[package]
name = "xfce4-panel"
version = "4.20.8"
description = "Xfce panel"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["gtk+", "garcon", "exo", "libxfce4ui", "libxfce4util", "xfconf", "libwnck", "libx11", "libxext", "libxfce4windowing"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/xfce4-panel"
commit = "56211a5feb13158447c930c8de2b713a9256c1be"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--enable-maintainer-mode", "--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug", "--disable-wayland"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
