[package]
name = "efivar"
version = "39"
description = "EFI variable library"
license = "LGPL-2.1-only"
arch = ["x86_64"]

[source]
url = "https://github.com/rhboot/efivar/archive/refs/tags/39.tar.gz"
sha256 = "c9edd15f2eeeea63232f3e669a48e992c7be9aff57ee22672ac31f5eca1609a6"

[build]
build = '''
make ENABLE_DOCS=0 libdir=/usr/lib bindir=/usr/bin includedir=/usr/include -j"$JOBS"
'''
install = '''
make ENABLE_DOCS=0 DESTDIR="$DESTDIR" libdir=/usr/lib bindir=/usr/bin includedir=/usr/include install
'''
