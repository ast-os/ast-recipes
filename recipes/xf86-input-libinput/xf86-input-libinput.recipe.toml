[package]
name = "xf86-input-libinput"
version = "1.5.0"
description = "libinput driver for the X server"
license = "MIT"
arch = ["x86_64"]
depends = ["libinput", "xorg-server"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/driver/xf86-input-libinput"
commit = "c712930ef4b544a5036fe2f55fd2ade9efb8ea78"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
