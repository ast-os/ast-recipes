[package]
name = "xf86-input-libinput"
version = "1.5.0"
description = "libinput driver for the X server"
license = "MIT"
arch = ["x86_64"]
depends = ["libinput", "xorg-server"]

[source]
url = "https://www.x.org/releases/individual/driver/xf86-input-libinput-1.5.0.tar.xz"
sha256 = "2524c35f196554ea11aef3bba1cf324759454e1d49f98ac026ace2f6003580e6"

[build]
style = "gnu"
configure = ["--disable-static"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
