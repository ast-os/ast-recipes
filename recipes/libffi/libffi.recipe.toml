[package]
name = "libffi"
version = "3.5.2"
description = "Foreign function interface"
license = "MIT"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "texinfo"]

[source]
git = "https://github.com/libffi/libffi"
commit = "e2eda0cf72a0598b44278cc91860ea402273fa29"

[build]
style = "gnu"
prepare = '''
./autogen.sh
'''
configure = ["--disable-static", "--with-gcc-arch=x86-64"]
