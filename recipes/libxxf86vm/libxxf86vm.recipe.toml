[package]
name = "libxxf86vm"
description = "XFree86-VidMode"
license = "MIT"
arch = ["x86_64"]
depends = ["libxext"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXxf86vm"
commit = "7f200bf00e3e288e47265c01decc401616c57f10"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
