[package]
name = "libxfce4ui"
version = "4.20.2"
description = "Xfce widget library"
license = "LGPL-2.0-or-later"
arch = ["x86_64"]
depends = ["gtk+", "xfconf", "libxfce4util", "libsm", "libice", "libx11"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/libxfce4ui"
commit = "0a95a6494817072b97452c198dfc552d15711b3e"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--enable-maintainer-mode", "--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug", "--disable-gladeui2", "--disable-glade"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
