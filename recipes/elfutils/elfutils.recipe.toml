[package]
name = "elfutils"
version = "0.193"
description = "libelf (the rest of elfutils is not installed)"
license = "GPL-3.0-or-later"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "bison", "flex"]
depends = ["zlib", "zstd", "xz"]

[source]
git = "https://sourceware.org/git/elfutils.git"
commit = "853c2943b582ac65fda6c28eaea21a1595fbaecd"

[build]
prepare = '''
autoreconf -fiv
'''
build = '''
./configure --prefix=/usr --disable-debuginfod --enable-libdebuginfod=dummy --enable-maintainer-mode
make -j"$JOBS"
'''
install = '''
make -C libelf DESTDIR="$DESTDIR" install
install -Dm644 config/libelf.pc "$DESTDIR/usr/lib/pkgconfig/libelf.pc"
rm -f "$DESTDIR/usr/lib/libelf.a"
'''
