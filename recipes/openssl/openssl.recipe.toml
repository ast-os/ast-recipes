[package]
name = "openssl"
description = "TLS and cryptography"
license = "Apache-2.0"
arch = ["x86_64"]
depends = ["zlib"]

[source]
git = "https://github.com/openssl/openssl"
commit = "0893a62353583343eb712adef6debdfbe597c227"

[build]
build = '''
./config --prefix=/usr --openssldir=/etc/ssl --libdir=lib shared zlib-dynamic
make -j"$JOBS"
'''
install = '''
sed -i '/INSTALL_LIBS/s/libcrypto.a libssl.a//' Makefile
make DESTDIR="$DESTDIR" MANSUFFIX=ssl install
'''
