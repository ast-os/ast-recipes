[package]
name = "glibc"
version = "2.42"
description = "The GNU C library"
license = "LGPL-2.1-or-later"
arch = ["x86_64"]
config_files = ["/etc/nsswitch.conf", "/etc/ld.so.conf"]

[source]
git = "https://sourceware.org/git/glibc.git"
commit = "d2097651cc57834dbfcaa102ddfacae0d86cfb66"

[build]
build = '''
mkdir -p build
cd build
echo "rootsbindir=/usr/sbin" > configparms
../configure --prefix=/usr --disable-werror --enable-kernel=5.4 --enable-stack-protector=strong --disable-nscd libc_cv_slibdir=/usr/lib
make -j"$JOBS"
'''
# the installation test needs perl, which is built later; ldd is made to name the loader of /usr/lib
install = '''
cd build
sed '/test-installation/s@$(PERL)@echo not running@' -i ../Makefile
make DESTDIR="$DESTDIR" install
sed '/RTLDLIST=/s@/usr@@g' -i "$DESTDIR/usr/bin/ldd"
'''
fixup = '''
install -d "$DESTDIR/etc/ld.so.conf.d"
cat > "$DESTDIR/etc/nsswitch.conf" <<'NSS'
passwd: files
group: files
shadow: files
hosts: files dns
networks: files
protocols: files
services: files
ethers: files
rpc: files
NSS
cat > "$DESTDIR/etc/ld.so.conf" <<'LDS'
/usr/local/lib
/opt/lib
include /etc/ld.so.conf.d/*.conf
LDS
'''
