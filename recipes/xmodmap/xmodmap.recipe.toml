[package]
name = "xmodmap"
version = "1.0.12"
description = "X.Org application xmodmap"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/xmodmap"
commit = "55b2208d2acea9609d81afe657da00859ae19e70"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
