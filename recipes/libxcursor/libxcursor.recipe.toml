[package]
name = "libxcursor"
description = "X cursors"
license = "MIT"
arch = ["x86_64"]
depends = ["libxfixes", "libxrender"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXcursor"
commit = "8ae6cf61b18ecddf26f72a07bbfbd1ea9f022c36"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
