[package]
name = "libxcursor"
version = "1.2.3"
description = "X cursors"
license = "MIT"
arch = ["x86_64"]
depends = ["libxfixes", "libxrender"]

[source]
url = "https://www.x.org/releases/individual/lib/libXcursor-1.2.3.tar.xz"
sha256 = "fde9402dd4cfe79da71e2d96bb980afc5e6ff4f8a7d74c159e1966afb2b2c2c0"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
