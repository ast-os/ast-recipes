[package]
name = "xfce4-appfinder"
version = "4.20.0"
description = "Xfce application finder"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["gtk+", "garcon", "libxfce4ui", "libxfce4util", "xfconf"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/xfce4-appfinder"
commit = "a96aaffd0ac036a5f13321accbc202bc820bfd1f"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
