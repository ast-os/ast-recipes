[package]
name = "zstd"
description = "Zstandard compression"
license = "BSD-3-Clause"
arch = ["x86_64"]

[source]
git = "https://github.com/facebook/zstd"
commit = "f8745da6ff1ad1e7bab384bd1f9d742439278e99"

[build]
build = '''
make prefix=/usr -j"$JOBS"
'''
install = '''
make prefix=/usr DESTDIR="$DESTDIR" install
'''
fixup = '''
rm -f "$DESTDIR/usr/lib/libzstd.a"
'''
