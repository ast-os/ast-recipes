[package]
name = "bash"
version = "5.3"
description = "The GNU shell"
license = "GPL-3.0-or-later"
revision = 2
arch = ["x86_64"]
depends = ["readline", "ncurses"]

[source]
git = "https://git.savannah.gnu.org/git/bash.git"
commit = "b8c60bc9ca365f8261fa97900b6fa939f6ebc303"

[build]
style = "gnu"
configure = ["--without-bash-malloc", "--with-installed-readline"]
fixup = '''
ln -sf bash "$DESTDIR/usr/bin/sh"
'''
