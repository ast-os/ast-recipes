[package]
name = "libxpm"
version = "3.5.20"
description = "X pixmap"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11", "libxt", "libxext"]

[source]
url = "https://www.x.org/releases/individual/lib/libXpm-3.5.20.tar.xz"
sha256 = "c064ead03e4dde78afdeb121fe0b644d25c550444cf903fbdc537f1a78f3ef74"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
