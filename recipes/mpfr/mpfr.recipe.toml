[package]
name = "mpfr"
description = "Multiple precision floating point"
license = "LGPL-3.0-or-later"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "texinfo"]
depends = ["gmp"]

[source]
git = "https://gitlab.inria.fr/mpfr/mpfr.git"
commit = "eaa57b856d814af32f97d5e5eb129fb986235323"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--enable-thread-safe"]
