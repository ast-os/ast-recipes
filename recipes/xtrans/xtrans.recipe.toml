[package]
name = "xtrans"
version = "1.6.0"
description = "X transport library"
license = "MIT"
arch = ["x86_64"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libxtrans"
commit = "cf05ba4a10c90da2c63805a5375e983b174e28b0"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
