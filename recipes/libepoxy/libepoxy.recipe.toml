[package]
name = "libepoxy"
description = "OpenGL function pointer management"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11", "mesa"]

[source]
git = "https://github.com/anholt/libepoxy"
commit = "c84bc9459357a40e46e2fec0408d04fbdde2c973"

[build]
style = "meson"
configure = ["-Dtests=false", "-Ddocs=false", "-Degl=yes", "-Dglx=yes", "-Dx11=true"]
