[package]
name = "libxml2"
version = "2.15.4"
description = "XML library"
license = "MIT"
arch = ["x86_64"]
depends = ["zlib", "xz"]

[source]
git = "https://gitlab.gnome.org/GNOME/libxml2"
commit = "96498992efa48d52b0e8b83058bd88dbdaf153c1"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--without-python", "--without-icu"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
