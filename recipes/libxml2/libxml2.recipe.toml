[package]
name = "libxml2"
version = "2.14.6"
description = "XML library"
license = "MIT"
arch = ["x86_64"]
depends = ["zlib", "xz"]

[source]
git = "https://gitlab.gnome.org/GNOME/libxml2"
commit = "d23960a130c5bb82779c9405fbbf85e65fb3c57c"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--without-python", "--without-icu"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
