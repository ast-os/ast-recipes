[package]
name = "xinit"
version = "1.4.4"
description = "X.Org application xinit"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11", "xauth"]

[source]
url = "https://www.x.org/releases/individual/app/xinit-1.4.4.tar.xz"
sha256 = "40a47c7a164c7f981ce3787b4b37f7e411fb43231dcde543d70094075dacfef9"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
