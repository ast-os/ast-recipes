[package]
name = "xinit"
description = "X.Org application xinit"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11", "xauth"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/xinit"
commit = "cfa71d44248562f22f2d92732c5e493e89061569"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
