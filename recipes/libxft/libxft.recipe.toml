[package]
name = "libxft"
description = "X FreeType interface"
license = "MIT"
arch = ["x86_64"]
depends = ["libxrender", "fontconfig", "freetype"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXft"
commit = "f4805c8645914cbdcfd42e71051ba3f8fc664ef5"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
