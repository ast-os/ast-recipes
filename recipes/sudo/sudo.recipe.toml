[package]
name = "sudo"
version = "1.9.17p2"
description = "Run commands as another user"
license = "ISC"
arch = ["x86_64"]
depends = ["zlib"]
config_files = ["/etc/sudoers"]

[source]
git = "https://github.com/sudo-project/sudo"
commit = "d1b48c651cec19fe37d1f0d3299d2283fb0f88e4"

[build]
style = "gnu"
configure = ["--libexecdir=/usr/lib", "--with-secure-path", "--with-env-editor", "--with-passprompt=\"[sudo] password for %p: \""]
