[package]
name = "pango"
description = "Text layout and rendering"
license = "LGPL-2.1-or-later"
arch = ["x86_64"]
depends = ["glib", "cairo", "harfbuzz", "fribidi", "freetype", "fontconfig", "libxft"]

[source]
git = "https://gitlab.gnome.org/GNOME/pango"
commit = "d360f14004e4a4824f2352f6e2722016f9a51dd6"

[build]
style = "meson"
configure = ["-Dintrospection=disabled", "-Dbuild-testsuite=false", "-Dbuild-examples=false", "-Ddocumentation=false", "-Dlibthai=disabled", "-Dxft=enabled"]
