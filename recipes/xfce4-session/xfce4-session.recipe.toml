[package]
name = "xfce4-session"
version = "4.20.4"
description = "Xfce session manager"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["gtk+", "libxfce4ui", "libxfce4util", "xfconf", "libwnck", "libsm", "xorg-server", "xinit", "dbus"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/xfce4-session"
commit = "0abb763a80647624e884c83d4ee172d957da0188"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--enable-maintainer-mode", "--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug", "--disable-polkit", "--disable-legacy-sm"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
