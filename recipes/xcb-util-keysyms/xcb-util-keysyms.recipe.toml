[package]
name = "xcb-util-keysyms"
description = "XCB utility library xcb-util-keysyms"
license = "MIT"
arch = ["x86_64"]
depends = ["libxcb"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libxcb-keysyms"
commit = "85e093f14b0ade2956e0a5d1c37cfde06d8b1ba6"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
