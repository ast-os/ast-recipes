[package]
name = "mesa"
version = "26.3.0"
description = "OpenGL, EGL and Vulkan drivers: radeonsi, radv, nouveau, llvmpipe"
license = "MIT"
arch = ["x86_64"]
depends = ["libdrm", "llvm", "expat", "zlib", "zstd", "libxshmfence", "libx11", "libxext", "libxfixes", "libxxf86vm", "libxrandr", "libxcb", "libxdamage"]
build_depends = ["python-mako", "python-pyyaml", "python-packaging"]

[source]
git = "https://gitlab.freedesktop.org/mesa/mesa"
commit = "0a6fa60abb737d26ac8a316a4aad7c9ddf64f9e4"

[build]
style = "meson"
configure = ["-Dplatforms=x11", "-Dgallium-drivers=llvmpipe,softpipe,radeonsi,nouveau,virgl", "-Dvulkan-drivers=", "-Dglx=dri", "-Dgbm=enabled", "-Degl=enabled", "-Dgles1=disabled", "-Dgles2=enabled", "-Dllvm=enabled", "-Dshared-llvm=enabled", "-Dvalgrind=disabled", "-Dlibunwind=disabled", "-Dbuild-tests=false", "-Dglvnd=disabled", "-Dvideo-codecs="]
