[package]
name = "dosfstools"
description = "FAT file system tools"
license = "GPL-3.0-or-later"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "pkgconf"]

[source]
git = "https://github.com/dosfstools/dosfstools"
commit = "697f7692c951173c1b732901e13f72bd3182d575"

[build]
style = "gnu"
prepare = '''
./autogen.sh
'''
configure = ["--enable-compat-symlinks"]
