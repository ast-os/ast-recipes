[package]
name = "util-macros"
version = "1.20.2"
description = "X.Org autotools macros"
license = "MIT"
arch = ["x86_64"]

[source]
git = "https://gitlab.freedesktop.org/xorg/util/macros"
commit = "a9d71e3fd8e6758b70be31c586921bbbcd2a8449"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
