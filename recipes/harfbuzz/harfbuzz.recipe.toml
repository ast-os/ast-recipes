[package]
name = "harfbuzz"
description = "Text shaping"
license = "MIT"
arch = ["x86_64"]
depends = ["glib", "freetype"]

[source]
git = "https://github.com/harfbuzz/harfbuzz"
commit = "3df40d9b98d6b32f0e4288d4ecfbb158ddb3a372"

[build]
style = "meson"
configure = ["-Dtests=disabled", "-Ddocs=disabled", "-Dglib=enabled", "-Dfreetype=enabled", "-Dcairo=disabled", "-Dintrospection=disabled", "-Dicu=disabled", "-Dgraphite=disabled", "-Dbenchmark=disabled", "-Dutilities=disabled"]
