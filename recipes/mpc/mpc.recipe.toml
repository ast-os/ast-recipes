[package]
name = "mpc"
version = "1.3.1"
description = "Complex number arithmetic"
license = "LGPL-3.0-or-later"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "texinfo"]
depends = ["gmp", "mpfr"]

[source]
git = "https://gitlab.inria.fr/mpc/mpc.git"
commit = "9e125d9407a8230339cfbae0857d3ad61cd378ce"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static"]
