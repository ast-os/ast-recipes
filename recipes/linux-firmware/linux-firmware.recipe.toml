[package]
name = "linux-firmware"
version = "20261019"
description = "Firmware of GPUs and other devices (amdgpu, radeon, i915, xe, nvidia)"
license = "Redistributable"
arch = ["x86_64"]

[source]
git = "https://gitlab.com/kernel-firmware/linux-firmware"
commit = "a2dcb924f0897368b0b4f305cbf9808cdda90ce0"

[build]
build = '''
true
'''
install = '''
for d in amdgpu radeon i915 xe nvidia intel/ibt-* ; do
    [ -e "$d" ] || continue
    install -d "$DESTDIR/usr/lib/firmware/$(dirname "$d")"
    cp -a --sparse=never "$d" "$DESTDIR/usr/lib/firmware/$(dirname "$d")/"
done
install -Dm644 WHENCE "$DESTDIR/usr/share/doc/linux-firmware/WHENCE"
'''
