[package]
name = "linux-firmware"
version = "20261019"
description = "Firmware of GPUs and other devices (amdgpu, radeon, i915, xe, nvidia)"
license = "Redistributable"
arch = ["x86_64"]

[source]
url = "https://cdn.kernel.org/pub/linux/kernel/firmware/linux-firmware-20261019.tar.xz"
sha256 = "a10d1ab5baf2c74ba92e8c7cf313e691696c26bddfa6df00db795e48d70cd4ca"

[build]
build = '''
true
'''
install = '''
for d in amdgpu radeon i915 xe nvidia intel/ibt-* ; do
    [ -e "$d" ] || continue
    install -d "$DESTDIR/usr/lib/firmware/$(dirname "$d")"
    cp -a "$d" "$DESTDIR/usr/lib/firmware/$(dirname "$d")/"
done
install -Dm644 WHENCE "$DESTDIR/usr/share/doc/linux-firmware/WHENCE"
'''
