[package]
name = "shadow"
version = "4.18.0"
description = "User and group management"
license = "BSD-3-Clause"
arch = ["x86_64"]
depends = ["libxcrypt", "acl", "attr"]
config_files = ["/etc/login.defs"]

[source]
url = "https://github.com/shadow-maint/shadow/releases/download/4.18.0/shadow-4.18.0.tar.xz"
sha256 = "add4604d3bc410344433122a819ee4154b79dd8316a56298c60417e637c07608"

[build]
style = "gnu"
configure = ["--disable-static", "--with-bcrypt", "--with-yescrypt", "--without-libbsd", "--with-group-name-max-length=32"]
install_args = ["exec_prefix=/usr"]
prepare = '''
sed -i 's/groups$(EXEEXT) //' src/Makefile.in
find man -name Makefile.in -exec sed -i 's/groups\.1 / /' {} \;
find man -name Makefile.in -exec sed -i 's/getspnam\.3 / /' {} \;
find man -name Makefile.in -exec sed -i 's/passwd\.5 / /' {} \;
sed -e 's:#ENCRYPT_METHOD DES:ENCRYPT_METHOD YESCRYPT:' -e 's:/var/spool/mail:/var/mail:' -e '/PATH=/{s@/sbin:@@;s@/bin:@@}' -i etc/login.defs
'''
fixup = '''
mkdir -p "$DESTDIR/etc/default"
'''
