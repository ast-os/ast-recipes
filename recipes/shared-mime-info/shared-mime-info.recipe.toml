[package]
name = "shared-mime-info"
description = "MIME type database"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["glib", "libxml2"]

[source]
git = "https://gitlab.freedesktop.org/xdg/shared-mime-info"
commit = "fd8ab89c20093f1bfba8fa9e302ba584fffd0fd7"

[build]
style = "meson"
configure = ["-Dupdate-mimedb=false", "-Dbuild-tools=true", "-Dbuild-translations=false", "-Dbuild-tests=false", "-Dbuild-spec=false"]
