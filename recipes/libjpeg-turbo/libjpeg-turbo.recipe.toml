[package]
name = "libjpeg-turbo"
description = "JPEG codec"
license = "BSD-3-Clause"
arch = ["x86_64"]
build_depends = ["cmake"]

[source]
git = "https://github.com/libjpeg-turbo/libjpeg-turbo"
commit = "7b4993786d856cbccabfc0ed2f923ba000e326cc"

[build]
style = "cmake"
configure = ["-DENABLE_STATIC=FALSE", "-DWITH_JAVA=0", "-DCMAKE_INSTALL_LIBDIR=lib"]
