[package]
name = "tree-sitter"
description = "Incremental parsing library"
license = "MIT"
arch = ["x86_64"]
depends = ["glibc"]
build_depends = ["make", "gcc"]

[source]
git = "https://github.com/tree-sitter/tree-sitter"
commit = "3fb7be49145acfb07e33b61ed5689e2b6771b2e9"

[build]
build = '''
make -j"$JOBS" PREFIX=/usr
'''
install = '''
make install PREFIX=/usr DESTDIR="$DESTDIR"
'''
fixup = '''
rm -f "$DESTDIR"/usr/lib/libtree-sitter.a
'''
