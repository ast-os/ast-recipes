[package]
name = "libxv"
description = "XVideo"
license = "MIT"
arch = ["x86_64"]
depends = ["libxext"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXv"
commit = "e1cde54538060c4fd3a3d02e3d2e2b7e5da7bff9"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
