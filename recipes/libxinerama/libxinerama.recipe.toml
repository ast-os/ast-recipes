[package]
name = "libxinerama"
version = "1.1.6"
description = "Xinerama"
license = "MIT"
arch = ["x86_64"]
depends = ["libxext"]

[source]
url = "https://www.x.org/releases/individual/lib/libXinerama-1.1.6.tar.xz"
sha256 = "d00fc1599c303dc5cbc122b8068bdc7405d6fcb19060f4597fc51bd3a8be51d7"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
