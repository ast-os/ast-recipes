[package]
name = "libxinerama"
version = "1.1.6"
description = "Xinerama"
license = "MIT"
arch = ["x86_64"]
depends = ["libxext"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXinerama"
commit = "cc4ac9cf36fdf3815381b791e47a90b8aebc7e78"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
