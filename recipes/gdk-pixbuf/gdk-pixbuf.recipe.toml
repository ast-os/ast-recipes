[package]
name = "gdk-pixbuf"
version = "2.44.8"
description = "Image loading library"
license = "LGPL-2.1-or-later"
arch = ["x86_64"]
depends = ["glib", "libpng", "libjpeg-turbo", "shared-mime-info"]

[source]
url = "https://download.gnome.org/sources/gdk-pixbuf/2.44/gdk-pixbuf-2.44.8.tar.xz"
sha256 = "919f529512961a12e81cd4b4b466a48c3933469e7f9a310c6513cd4fb252ba3c"

[build]
style = "meson"
configure = ["-Dintrospection=disabled", "-Dman=false", "-Ddocumentation=false", "-Dtests=false", "-Dinstalled_tests=false", "-Dothers=disabled", "-Dtiff=disabled", "-Dpng=enabled", "-Djpeg=enabled", "-Dbuiltin_loaders=png,jpeg", "-Dgio_sniffing=false"]
