[package]
name = "aster"
version = "1.2"
description = "asterOS: the layout of the file system, the system accounts, os-release, profile, fstab, the configuration and the key of ast"
license = "MIT"
arch = ["x86_64"]
config_files = ["/etc/ast/ast.toml", "/etc/ast/repos.toml", "/etc/fstab", "/etc/group", "/etc/hosts", "/etc/passwd", "/etc/inputrc", "/etc/issue", "/etc/profile", "/etc/shells"]

[source]
url = "aster-1.2.tar.gz"
sha256 = "f6840b75371fec811033069b38ee4f7b7d213636c6a652e82fc40377f0078068"
strip = 0

[build]
build = '''
true
'''
install = '''
cp -a bin sbin lib lib64 etc "$DESTDIR/"
'''
