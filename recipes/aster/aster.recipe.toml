[package]
name = "aster"
version = "1.7"
description = "asterOS: the layout of the file system, the system accounts, os-release, profile, fstab, the configuration and the key of ast"
license = "MIT"
arch = ["x86_64"]
config_files = ["/etc/ast/ast.toml", "/etc/ast/repos.toml", "/etc/default/grub", "/etc/fstab", "/etc/group", "/etc/hosts", "/etc/passwd", "/etc/inputrc", "/etc/issue", "/etc/profile", "/etc/shells"]

[source]
url = "aster/aster-1.7.tar.gz"
sha256 = "0b979d58df0d3e566c18fa3afcedeca14b5efe7f5aac3f037bc742e9d04e5e19"
strip = 0

[build]
build = '''
true
'''
install = '''
cp -a bin sbin lib lib64 etc "$DESTDIR/"
'''
