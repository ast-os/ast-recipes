[package]
name = "libxshmfence"
version = "1.3.3"
description = "Shared memory fences"
license = "MIT"
arch = ["x86_64"]
depends = ["xorgproto"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libxshmfence"
commit = "89f064748554e11832a3ec783945e1f4c7fe846e"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
