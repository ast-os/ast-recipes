[package]
name = "libxshmfence"
version = "1.3.3"
description = "Shared memory fences"
license = "MIT"
arch = ["x86_64"]
depends = ["xorgproto"]

[source]
url = "https://www.x.org/releases/individual/lib/libxshmfence-1.3.3.tar.xz"
sha256 = "d4a4df096aba96fea02c029ee3a44e11a47eb7f7213c1a729be83e85ec3fde10"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
