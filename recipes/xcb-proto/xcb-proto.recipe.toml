[package]
name = "xcb-proto"
description = "XCB protocol descriptions"
license = "MIT"
arch = ["x86_64"]
depends = ["python"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/proto/xcbproto"
commit = "77d7fc04da729ddc5ed4aacf30253726fac24dca"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
