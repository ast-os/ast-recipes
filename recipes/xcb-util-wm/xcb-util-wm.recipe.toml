[package]
name = "xcb-util-wm"
version = "0.4.2"
description = "XCB utility library xcb-util-wm"
license = "MIT"
arch = ["x86_64"]
depends = ["libxcb"]

[source]
url = "https://xcb.freedesktop.org/dist/xcb-util-wm-0.4.2.tar.xz"
sha256 = "62c34e21d06264687faea7edbf63632c9f04d55e72114aa4a57bb95e4f888a0b"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
