[package]
name = "xcb-util-wm"
version = "0.4.2"
description = "XCB utility library xcb-util-wm"
license = "MIT"
arch = ["x86_64"]
depends = ["libxcb"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libxcb-wm"
commit = "0c6681e465c9cc7b1fbb60778ba1eaa61ab01a14"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
