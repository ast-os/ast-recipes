[package]
name = "libxcrypt"
version = "4.4.38"
description = "Password hashing library"
license = "LGPL-2.1-or-later"
arch = ["x86_64"]

[source]
url = "https://github.com/besser82/libxcrypt/releases/download/v4.4.38/libxcrypt-4.4.38.tar.xz"
sha256 = "80304b9c306ea799327f01d9a7549bdb28317789182631f1b54f4511b4206dd6"

[build]
style = "gnu"
configure = ["--enable-hashes=strong,glibc", "--enable-obsolete-api=no", "--disable-static", "--disable-failure-tokens"]
