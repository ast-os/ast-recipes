[package]
name = "xterm"
version = "1.18.6"
description = "Terminal emulator for X"
license = "X11"
arch = ["x86_64"]
depends = ["libxaw", "libxft", "fontconfig", "ncurses", "libxinerama", "libxt", "libxmu", "libxpm"]

[source]
url = "https://github.com/ThomasDickey/xterm-snapshots/archive/refs/tags/pcre2-10.49.tar.gz"
sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

[build]
style = "gnu"
configure = ["--enable-wide-chars", "--enable-256-color", "--with-x", "--disable-setuid", "--disable-full-tgetent"]
