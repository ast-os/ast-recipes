[package]
name = "libxcomposite"
version = "0.4.7"
description = "XComposite"
license = "MIT"
arch = ["x86_64"]
depends = ["libxfixes"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXcomposite"
commit = "a6d5d773e2a4e5a11b58f3a894f2085686baa6f4"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
