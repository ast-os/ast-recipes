[package]
name = "setxkbmap"
version = "1.3.5"
description = "X.Org application setxkbmap"
license = "MIT"
arch = ["x86_64"]
depends = ["libxkbfile", "libx11"]

[source]
url = "https://www.x.org/releases/individual/app/setxkbmap-1.3.5.tar.xz"
sha256 = "360193cecc93f906d8383a8fb5c1f3a7eed35e6ced0e118a64ee56ae13c88cac"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
