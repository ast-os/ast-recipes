[package]
name = "setxkbmap"
version = "1.3.5"
description = "X.Org application setxkbmap"
license = "MIT"
arch = ["x86_64"]
depends = ["libxkbfile", "libx11"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/setxkbmap"
commit = "66d92298f83dd3406303fd2b376d70f5cb1b704d"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
