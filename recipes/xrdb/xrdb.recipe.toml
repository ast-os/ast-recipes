[package]
name = "xrdb"
description = "X.Org application xrdb"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11", "libxmu"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/xrdb"
commit = "aaf6f3df9377a44081af49a7fb2ae14aa3a18e60"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
