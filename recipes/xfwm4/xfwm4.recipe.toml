[package]
name = "xfwm4"
version = "4.20.0"
description = "Xfce window manager"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["gtk+", "libxfce4ui", "libxfce4util", "xfconf", "libwnck", "libxcomposite", "libxdamage", "libxrandr", "libxext", "libepoxy"]

[source]
url = "https://archive.xfce.org/src/xfce/xfwm4/4.20/xfwm4-4.20.0.tar.bz2"
sha256 = "a58b63e49397aa0d8d1dcf0636be93c8bb5926779aef5165e0852890190dcf06"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug", "--disable-startup-notification"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
