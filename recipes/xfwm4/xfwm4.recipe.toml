[package]
name = "xfwm4"
description = "Xfce window manager"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["gtk+", "libxfce4ui", "libxfce4util", "xfconf", "libwnck", "libxcomposite", "libxdamage", "libxrandr", "libxext", "libepoxy", "libxfce4windowing"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/xfwm4"
commit = "7cadce33226be955fa2677b97a1969701d246b80"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--enable-maintainer-mode", "--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug", "--disable-startup-notification"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
