[package]
name = "xcb-util-cursor"
version = "0.1.6"
description = "XCB utility library xcb-util-cursor"
license = "MIT"
arch = ["x86_64"]
depends = ["xcb-util-image", "xcb-util-renderutil"]

[source]
url = "https://xcb.freedesktop.org/dist/xcb-util-cursor-0.1.6.tar.xz"
sha256 = "fdeb8bd127873519be5cc70dcd0d3b5d33b667877200f9925a59fdcad8f7a933"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
