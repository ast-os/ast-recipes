[package]
name = "pcre2"
version = "10.49"
description = "Perl-compatible regular expressions"
license = "BSD-3-Clause"
arch = ["x86_64"]

[source]
git = "https://github.com/PCRE2Project/pcre2"
commit = "6f9d7c1373262c541324a16a358785b33ef116cf"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--enable-unicode", "--enable-jit", "--enable-pcre2-16", "--enable-pcre2-32"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
