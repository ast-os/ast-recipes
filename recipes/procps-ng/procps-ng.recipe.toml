[package]
name = "procps-ng"
description = "ps, top, free, vmstat..."
license = "GPL-2.0-or-later"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "pkgconf"]
depends = ["ncurses"]

[source]
git = "https://gitlab.com/procps-ng/procps.git"
commit = "f46b2f7929cdfe2913ed0a7f585b09d6adbf994e"

[build]
style = "gnu"
prepare = '''
./autogen.sh
'''
configure = ["--disable-static", "--disable-kill", "--enable-watch8bit"]
