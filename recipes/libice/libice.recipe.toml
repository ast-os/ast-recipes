[package]
name = "libice"
version = "1.1.2"
description = "Inter-client exchange"
license = "MIT"
arch = ["x86_64"]
depends = ["xorgproto", "xtrans"]

[source]
url = "https://www.x.org/releases/individual/lib/libICE-1.1.2.tar.xz"
sha256 = "974e4ed414225eb3c716985df9709f4da8d22a67a2890066bc6dfc89ad298625"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
