[package]
name = "libice"
description = "Inter-client exchange"
license = "MIT"
arch = ["x86_64"]
depends = ["xorgproto", "xtrans"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libICE"
commit = "adf389fc19aedbf1be077b05365d164cd6f463d8"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
