[package]
name = "xfconf"
version = "4.20.0"
description = "Xfce configuration storage"
license = "LGPL-2.0-or-later"
arch = ["x86_64"]
depends = ["glib", "dbus", "libxfce4util"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/xfconf"
commit = "078859af53858cddfa99c4b72070a70ed3eb6772"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
