[package]
name = "libxfont2"
version = "2.0.9"
description = "X font library"
license = "MIT"
arch = ["x86_64"]
depends = ["freetype", "libfontenc", "xtrans", "xorgproto"]
build_depends = ["font-util", "util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXfont"
commit = "975cc6526e892c6fad8fa49d0fef58565fbaa003"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc", "--disable-devel-docs"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
