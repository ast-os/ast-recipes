[package]
name = "xkbcomp"
description = "XKB keymap compiler"
license = "MIT"
arch = ["x86_64"]
depends = ["libxkbfile", "libx11"]
build_depends = ["util-macros", "xorgproto"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/xkbcomp"
commit = "2c7789785981ad1fce3858c726615b49293f7de0"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
