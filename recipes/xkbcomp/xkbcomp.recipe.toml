[package]
name = "xkbcomp"
version = "1.5.0"
description = "XKB keymap compiler"
license = "MIT"
arch = ["x86_64"]
depends = ["libxkbfile", "libx11"]
build_depends = ["xorgproto"]

[source]
url = "https://www.x.org/releases/individual/app/xkbcomp-1.5.0.tar.xz"
sha256 = "2ac31f26600776db6d9cd79b3fcd272263faebac7eb85fb2f33c7141b8486060"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
