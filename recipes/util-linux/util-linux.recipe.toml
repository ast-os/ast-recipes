[package]
name = "util-linux"
description = "System utilities (mount, fdisk, lsblk...)"
license = "GPL-2.0-or-later"
revision = 4
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "bison", "pkgconf"]
config_files = ["/etc/orchid/services/agetty-tty1.toml", "/etc/orchid/services/agetty-ttyS0.toml"]
depends = ["ncurses", "zlib"]

[source]
git = "https://git.kernel.org/pub/scm/utils/util-linux/util-linux.git"
commit = "67b6f19adad289cc4ff4071ae8eceda41bdce9e8"

[build]
style = "gnu"
prepare = '''
./autogen.sh
'''
configure = ["--bindir=/usr/bin", "--libdir=/usr/lib", "--runstatedir=/run", "--sbindir=/usr/sbin", "--disable-chfn-chsh", "--disable-login", "--disable-nologin", "--disable-su", "--disable-setpriv", "--disable-runuser", "--disable-pylibmount", "--disable-liblastlog2", "--disable-static", "--without-python", "--without-systemd", "--without-systemdsystemunitdir", "ADJTIME_PATH=/var/lib/hwclock/adjtime"]
fixup = '''
install -d "$DESTDIR/etc/orchid/services"
cat > "$DESTDIR/etc/orchid/services/agetty-tty1.toml" <<'SERVICE'
[service]
description = "login on the first console"
exec = ["/usr/sbin/agetty", "tty1", "linux"]
after = ["mounts", "udev-settle", "random-seed", "swap", "sysctl", "hwclock", "dhcpcd", "syslogd"]
restart = "always"
SERVICE
cat > "$DESTDIR/etc/orchid/services/agetty-ttyS0.toml" <<'SERVICE'
[service]
description = "login on the serial console"
exec = ["/usr/sbin/agetty", "-L", "115200", "ttyS0", "vt100"]
after = ["mounts", "udev-settle", "random-seed", "swap", "sysctl", "hwclock", "dhcpcd", "syslogd"]
restart = "always"
SERVICE
mkdir -p "$DESTDIR/var/lib/hwclock"
'''
