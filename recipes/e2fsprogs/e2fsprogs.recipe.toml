[package]
name = "e2fsprogs"
version = "1.47.3"
description = "ext2/3/4 tools"
license = "GPL-2.0-only"
arch = ["x86_64"]
depends = ["util-linux"]

[source]
git = "https://git.kernel.org/pub/scm/fs/ext2/e2fsprogs.git"
commit = "da631e117dcf8797bfda0f48bdaa05ac0fbcf7af"

[build]
style = "gnu"
configure = ["--enable-elf-shlibs", "--disable-libblkid", "--disable-libuuid", "--disable-uuidd", "--disable-fsck"]
out_of_tree = true
fixup = '''
rm -f "$DESTDIR"/usr/lib/{libcom_err,libe2p,libext2fs,libss}.a
'''
