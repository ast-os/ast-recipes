[package]
name = "efibootmgr"
description = "UEFI boot manager tool"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["efivar", "popt"]

[source]
git = "https://github.com/rhboot/efibootmgr"
commit = "c3f9f0534e32158f62c43564036878b93b9e0fd6"

[build]
build = '''
make -j"$JOBS" EFIDIR=asteros
'''
install = '''
make DESTDIR="$DESTDIR" EFIDIR=asteros install
'''
