[package]
name = "python-markupsafe"
version = "3.0.4"
description = "String escaping for templates"
license = "BSD-3-Clause"
arch = ["x86_64"]
depends = ["python"]

[source]
git = "https://github.com/pallets/markupsafe"
commit = "ece26078ec168ebac69f02877238e68d4b376c91"

[build]
build = '''
true
'''
install = '''
site="$DESTDIR/usr/lib/python3.13/site-packages"
mkdir -p "$site"
cp -r src/markupsafe "$site/"
'''
