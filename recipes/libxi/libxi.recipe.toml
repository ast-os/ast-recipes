[package]
name = "libxi"
version = "1.8.4"
description = "XInput"
license = "MIT"
arch = ["x86_64"]
depends = ["libxext", "libxfixes"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXi"
commit = "9ea632ab9dce9ad6630ef7db9d1850ea3d0a2419"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
