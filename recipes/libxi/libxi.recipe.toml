[package]
name = "libxi"
version = "1.8.4"
description = "XInput"
license = "MIT"
arch = ["x86_64"]
depends = ["libxext", "libxfixes"]

[source]
url = "https://www.x.org/releases/individual/lib/libXi-1.8.4.tar.xz"
sha256 = "ddd6057b89a91903bc2f884d55c8467440906945e482c36547260dff28661afc"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
