[package]
name = "python"
version = "3.13.7"
description = "Python"
license = "PSF-2.0"
arch = ["x86_64"]
depends = ["expat", "libffi", "openssl", "zlib", "readline"]

[source]
git = "https://github.com/python/cpython"
commit = "bcee1c322115c581da27600f2ae55e5439c027eb"

[build]
style = "gnu"
configure = ["--enable-shared", "--with-system-expat", "--without-ensurepip"]
