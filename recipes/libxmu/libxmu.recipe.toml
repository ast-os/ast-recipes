[package]
name = "libxmu"
version = "1.3.1"
description = "X miscellaneous utilities"
license = "MIT"
arch = ["x86_64"]
depends = ["libxt", "libxext"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXmu"
commit = "cdf280f6611932f79ab872832974e8043b1cad6d"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
