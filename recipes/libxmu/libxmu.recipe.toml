[package]
name = "libxmu"
version = "1.3.1"
description = "X miscellaneous utilities"
license = "MIT"
arch = ["x86_64"]
depends = ["libxt", "libxext"]

[source]
url = "https://www.x.org/releases/individual/lib/libXmu-1.3.1.tar.xz"
sha256 = "81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
