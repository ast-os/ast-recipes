[package]
name = "xdpyinfo"
version = "1.4.0"
description = "X.Org application xdpyinfo"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11", "libxext", "libxtst", "libxi"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/xdpyinfo"
commit = "7fe49a22498b9438a15d5d9fdef55d5d832b1672"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
