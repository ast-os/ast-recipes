[package]
name = "xdpyinfo"
version = "1.4.0"
description = "X.Org application xdpyinfo"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11", "libxext", "libxtst", "libxi"]

[source]
url = "https://www.x.org/releases/individual/app/xdpyinfo-1.4.0.tar.xz"
sha256 = "dc1de6e6e091ed46c4837b0ae9811e8182f7be0d2af638cab3e530ff081a48b6"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
