[package]
name = "libcap"
version = "2.76"
description = "POSIX capabilities"
license = "BSD-3-Clause"
arch = ["x86_64"]

[source]
url = "https://www.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.76.tar.xz"
sha256 = "629da4ab29900d0f7fcc36227073743119925fd711c99a1689bbf5c9b40c8e6f"

[build]
prepare = '''
sed -i '/install -m.*STA/d' libcap/Makefile
'''
build = '''
make prefix=/usr lib=lib -j"$JOBS"
'''
install = '''
make prefix=/usr lib=lib DESTDIR="$DESTDIR" install
'''
