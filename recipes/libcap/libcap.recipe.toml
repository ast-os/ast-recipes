[package]
name = "libcap"
version = "2.76"
description = "POSIX capabilities"
license = "BSD-3-Clause"
revision = 2
arch = ["x86_64"]

[source]
git = "https://git.kernel.org/pub/scm/libs/libcap/libcap.git"
commit = "5f3e12ca39c476b78160df6e2345a642a8e6f178"

[build]
build = '''
make prefix=/usr lib=lib -j"$JOBS"
'''
install = '''
make prefix=/usr lib=lib DESTDIR="$DESTDIR" install
'''
fixup = '''
rm -f "$DESTDIR"/usr/lib/libcap.a "$DESTDIR"/usr/lib/libpsx.a
'''
