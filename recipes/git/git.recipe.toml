[package]
name = "git"
version = "2.56.1"
description = "Distributed version control system"
license = "GPL-2.0-only"
arch = ["x86_64"]
depends = ["curl", "openssl", "zlib", "expat", "ca-certificates"]
build_depends = ["gettext", "autoconf"]

[source]
git = "https://github.com/git/git"
commit = "03b41523c576f26ad34085378717a0c1b287470f"

[build]
style = "gnu"
prepare = '''
make configure
'''
# the commands written in perl, python and tcl, and the parts in Rust, are left out: none of them is part of the base
configure = ["--with-openssl", "--with-curl", "--with-expat", "--without-tcltk", "--without-python"]
make = ["NO_PERL=1", "NO_TCLTK=1", "NO_PYTHON=1", "NO_GETTEXT=1", "NO_RUST=1"]
install_args = ["NO_PERL=1", "NO_TCLTK=1", "NO_PYTHON=1", "NO_GETTEXT=1", "NO_RUST=1"]
fixup = '''
rm -rf "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/man"
'''
