[package]
name = "cairo"
version = "1.18.6"
description = "2D graphics library"
license = "LGPL-2.1-only OR MPL-1.1"
arch = ["x86_64"]
depends = ["pixman", "freetype", "fontconfig", "libpng", "glib", "libx11", "libxrender", "libxext", "libxcb", "zlib"]

[source]
url = "https://www.cairographics.org/releases/cairo-1.18.6.tar.xz"
sha256 = "1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4"

[build]
style = "meson"
configure = ["-Dtests=disabled", "-Dxlib=enabled", "-Dxcb=enabled", "-Dfontconfig=enabled", "-Dfreetype=enabled", "-Dpng=enabled", "-Dzlib=enabled", "-Dglib=enabled", "-Dspectre=disabled", "-Dsymbol-lookup=disabled"]
