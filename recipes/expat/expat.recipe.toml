[package]
name = "expat"
description = "XML parser"
license = "MIT"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool"]

[source]
git = "https://github.com/libexpat/libexpat"
commit = "f9a3eeb3e09fbea04b1c451ffc422ab2f1e45744"

[build]
prepare = '''
cd expat
./buildconf.sh
'''
build = '''
cd expat
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static --without-docbook
make -j"$JOBS"
'''
install = '''
cd expat
make DESTDIR="$DESTDIR" install
'''
