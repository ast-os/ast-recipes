[package]
name = "ca-certificates"
version = "2026.11.05"
description = "The certificate authorities Mozilla trusts, as a bundle (extracted by the curl project)"
license = "MPL-2.0"
arch = ["x86_64"]

[source]
url = "https://curl.se/ca/cacert-2026-11-05.pem"
sha256 = "427c064216761a1e72a8b30f0d954d08cb6e4435a82091fb865afd20c8497285"
plain = true

[build]
build = '''
true
'''
install = '''
install -Dm644 cacert-2026-11-05.pem "$DESTDIR/etc/ssl/certs/ca-certificates.crt"
ln -s certs/ca-certificates.crt "$DESTDIR/etc/ssl/cert.pem"
'''
