[package]
name = "grub"
version = "2.12"
description = "The boot loader (UEFI)"
license = "GPL-3.0-or-later"
arch = ["x86_64"]
depends = ["gettext"]

[source]
url = "https://ftpmirror.gnu.org/grub/grub-2.12.tar.xz"
sha256 = "f3c97391f7c4eaa677a78e090c7e97e6dc47b16f655f04683ebd37bef7fe0faa"

[build]
style = "gnu"
configure = ["--disable-efiemu", "--disable-werror", "--with-platform=efi"]
prepare = '''
unset {C,CPP,CXX,LD}FLAGS
echo depends bli part_gpt > grub-core/extra_deps.lst
'''
