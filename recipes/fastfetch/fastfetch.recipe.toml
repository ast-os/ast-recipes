[package]
name = "fastfetch"
version = "2.71.0"
description = "Fast system information tool written in C"
license = "MIT"
arch = ["x86_64"]
depends = ["glibc", "zlib"]
build_depends = ["cmake", "ninja", "pkgconf"]

[source]
git = "https://github.com/fastfetch-cli/fastfetch"
commit = "8c9d9c0449dd515e0088c4a60a38d2dc40c5ccd0"

[build]
style = "cmake"
configure = ["-GNinja", "-DBUILD_FLASHFETCH=OFF", "-DENABLE_VULKAN=OFF", "-DENABLE_WAYLAND=OFF", "-DENABLE_XCB_RANDR=OFF", "-DENABLE_XRANDR=OFF", "-DENABLE_X11=OFF", "-DENABLE_GIO=OFF", "-DENABLE_DCONF=OFF", "-DENABLE_DBUS=OFF", "-DENABLE_IMAGEMAGICK7=OFF", "-DENABLE_IMAGEMAGICK6=OFF", "-DENABLE_CHAFA=OFF", "-DENABLE_EGL=OFF", "-DENABLE_GLX=OFF", "-DENABLE_OPENCL=OFF", "-DENABLE_PULSE=OFF", "-DENABLE_DDCUTIL=OFF", "-DENABLE_ELF=OFF", "-DENABLE_LIBZFS=OFF", "-DENABLE_RPM=OFF", "-DENABLE_SQLITE3=OFF", "-DENABLE_DRM=OFF", "-DENABLE_DRM_AMDGPU=OFF", "-DENABLE_FREETYPE=OFF"]
