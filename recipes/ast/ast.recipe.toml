[package]
name = "ast"
description = "The package manager of asterOS"
license = "BSD-3-Clause"
revision = 8
arch = ["x86_64"]
depends = ["glibc", "bubblewrap", "ca-certificates"]
build_depends = ["rust-bin"]

[source]
git = "https://github.com/ast-os/ast-pm"
commit = "2c15f99e7f56a9a8b96e3ac087124d3572d8fbe3"

[build]
style = "cargo"
bins = ["ast", "astrap", "astfstab", "astchroot", "astpkg"]
