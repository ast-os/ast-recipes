[package]
name = "ast"
version = "0.1.0"
description = "The package manager of asterOS"
license = "BSD-3-Clause"
revision = 5
arch = ["x86_64"]
depends = ["glibc", "bubblewrap", "ca-certificates"]
build_depends = ["rust-bin"]

[source]
url = "ast/ast-0.1.0.tar.xz"
sha256 = "c3754bcf0a9b1d1d7e8d9cd70c8c29915337e2a0238d84bd6abac68857def3df"

[build]
style = "cargo"
bins = ["ast", "astrap", "astfstab", "astchroot", "astpkg"]
