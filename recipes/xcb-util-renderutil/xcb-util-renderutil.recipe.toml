[package]
name = "xcb-util-renderutil"
version = "0.3.10"
description = "XCB utility library xcb-util-renderutil"
license = "MIT"
arch = ["x86_64"]
depends = ["libxcb"]

[source]
url = "https://xcb.freedesktop.org/dist/xcb-util-renderutil-0.3.10.tar.xz"
sha256 = "3e15d4f0e22d8ddbfbb9f5d77db43eacd7a304029bf25a6166cc63caa96d04ba"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
