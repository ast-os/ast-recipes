[package]
name = "sysklogd"
version = "2.7.2"
description = "System and kernel logging"
license = "BSD-3-Clause"
arch = ["x86_64"]
config_files = ["/etc/syslog.conf"]

[source]
url = "https://github.com/troglobit/sysklogd/releases/download/v2.7.2/sysklogd-2.7.2.tar.gz"
sha256 = "bc410ca64551a11fac6518b418fb6b8afbd888a70af2c5eb353334a706727bca"

[build]
style = "gnu"
configure = ["--runstatedir=/run", "--without-logger"]
fixup = '''
mkdir -p "$DESTDIR/etc"
cat > "$DESTDIR/etc/syslog.conf" <<'SYSLOG'
auth,authpriv.* -/var/log/auth.log
*.*;auth,authpriv.none -/var/log/sys.log
daemon.* -/var/log/daemon.log
kern.* -/var/log/kern.log
mail.* -/var/log/mail.log
user.* -/var/log/user.log
*.emerg *
SYSLOG
'''
