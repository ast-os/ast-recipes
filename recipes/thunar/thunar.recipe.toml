[package]
name = "thunar"
version = "4.20.10"
description = "Xfce file manager"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["exo", "gtk+", "libxfce4ui", "libxfce4util", "xfconf", "gdk-pixbuf", "shared-mime-info", "desktop-file-utils"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/thunar"
commit = "7760dfaa32db5ab6049606ca048ba2219688f369"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug", "--disable-notifications", "--disable-gudev"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
