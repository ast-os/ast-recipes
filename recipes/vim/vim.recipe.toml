[package]
name = "vim"
version = "9.1.1629"
description = "Text editor"
license = "Vim"
arch = ["x86_64"]
depends = ["ncurses"]

[source]
url = "https://github.com/vim/vim/archive/v9.1.1629/vim-9.1.1629.tar.gz"
sha256 = "d92c6550e8eca741085fce94e5b0d3d13d2c62fcb5b69bf5a6010d3114de4828"

[build]
style = "gnu"
prepare = '''
echo '#define SYS_VIMRC_FILE "/etc/vimrc"' >> src/feature.h
'''
fixup = '''
ln -sf vim "$DESTDIR/usr/bin/vi"
'''
