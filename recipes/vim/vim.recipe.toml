[package]
name = "vim"
version = "9.1.1629"
description = "Text editor"
license = "Vim"
arch = ["x86_64"]
depends = ["ncurses"]

[source]
git = "https://github.com/vim/vim"
commit = "706b6f5867cb0fe65c4fefac8382fe2995eedde7"

[build]
style = "gnu"
# the system vimrc lives in /etc
prepare = '''
echo '#define SYS_VIMRC_FILE "/etc/vimrc"' >> src/feature.h
'''
fixup = '''
ln -sf vim "$DESTDIR/usr/bin/vi"
'''
