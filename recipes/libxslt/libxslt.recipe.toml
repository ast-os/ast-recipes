[package]
name = "libxslt"
version = "1.1.45"
description = "XSLT library and xsltproc"
license = "MIT"
arch = ["x86_64"]
depends = ["libxml2"]

[source]
git = "https://gitlab.gnome.org/GNOME/libxslt"
commit = "35323d6a15f6e63c9919ddbc0abe64c90a0dd88a"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--without-python", "--without-crypto"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
