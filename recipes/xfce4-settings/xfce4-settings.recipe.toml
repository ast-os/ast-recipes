[package]
name = "xfce4-settings"
version = "4.20.5"
description = "Xfce settings manager"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["gtk+", "exo", "garcon", "libxfce4ui", "libxfce4util", "xfconf", "libxi", "libxrandr", "libxcursor", "libxkbfile", "libxfce4windowing"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/xfce4-settings"
commit = "02ee2a3ff9c83a4fa9ebce73377c61a77e7549f6"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--enable-maintainer-mode", "--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug", "--disable-libnotify", "--disable-libxklavier", "--disable-upower-glib", "--disable-colord", "--enable-xorg-libinput"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
