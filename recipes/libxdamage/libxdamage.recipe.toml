[package]
name = "libxdamage"
version = "1.1.7"
description = "XDamage"
license = "MIT"
arch = ["x86_64"]
depends = ["libxfixes"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXdamage"
commit = "4ff0f0e76c974faf920e476abccc65a4990a637c"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
