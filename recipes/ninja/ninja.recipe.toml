[package]
name = "ninja"
description = "Build system"
license = "Apache-2.0"
arch = ["x86_64"]
depends = ["python"]

[source]
git = "https://github.com/ninja-build/ninja"
commit = "79feac0f3e3bc9da9effc586cd5fea41e7550051"

[build]
build = '''
python3 configure.py --bootstrap --verbose
'''
install = '''
install -Dm755 ninja "$DESTDIR/usr/bin/ninja"
'''
