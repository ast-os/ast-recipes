[package]
name = "xprop"
version = "1.2.8"
description = "X.Org application xprop"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/xprop"
commit = "a6906a8a067bbfaf2f4a47af1521a85340461714"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
