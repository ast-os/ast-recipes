[package]
name = "texinfo"
version = "7.2"
description = "Documentation system"
license = "GPL-3.0-or-later"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext"]
depends = ["perl", "ncurses"]

[source]
git = "https://git.savannah.gnu.org/git/texinfo.git"
commit = "f244dc37b295ec0867524c1725b3a96a04ca6ba1"

[build]
style = "gnu"
# the man pages need help2man, which the base does not have
prepare = '''
sed -i 's/texindex util doc man$/texindex util doc/' Makefile.am
./autogen.sh
'''
