[package]
name = "lz4"
description = "LZ4 compression"
license = "BSD-2-Clause"
arch = ["x86_64"]

[source]
git = "https://github.com/lz4/lz4"
commit = "ebb370ca83af193212df4dcbadcc5d87bc0de2f0"

[build]
build = '''
make BUILD_STATIC=no PREFIX=/usr -j"$JOBS"
'''
install = '''
make BUILD_STATIC=no PREFIX=/usr DESTDIR="$DESTDIR" install
'''
