[package]
name = "binutils"
description = "Assembler, linker and binary tools"
license = "GPL-3.0-or-later"
arch = ["x86_64"]

[source]
git = "https://sourceware.org/git/binutils-gdb.git"
commit = "2bc7af1ff7732451b6a7b09462a815c3284f9613"

[build]
style = "gnu"
configure = ["--enable-ld=default", "--enable-plugins", "--enable-shared", "--disable-werror", "--enable-64-bit-bfd", "--enable-new-dtags", "--enable-default-hash-style=gnu", "--disable-gdb", "--disable-gdbserver", "--disable-sim", "--disable-readline", "--disable-libdecnumber"]
make = ["tooldir=/usr"]
install_args = ["tooldir=/usr"]
out_of_tree = true
fixup = '''
rm -rf "$DESTDIR/usr/share/doc"
rm -rf "$DESTDIR"/usr/lib/lib{bfd,ctf,ctf-nobfd,gprofng,opcodes,sframe}.a "$DESTDIR/usr/share/doc/gprofng"
'''
