[package]
name = "kbd"
description = "Keyboard and console tools"
license = "GPL-2.0-or-later"
revision = 2
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext"]

[source]
git = "https://git.kernel.org/pub/scm/linux/kernel/git/legion/kbd.git"
commit = "7f08e8dbeedf045582af2af78942dd2dd585c518"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-vlock"]
fixup = '''
rm -f "$DESTDIR/usr/bin/resizecons" "$DESTDIR/usr/share/man/man8/resizecons.8"
'''
