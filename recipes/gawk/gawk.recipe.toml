[package]
name = "gawk"
version = "5.3.2"
description = "Text processing"
license = "GPL-3.0-or-later"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext"]
depends = ["readline"]

[source]
git = "https://git.savannah.gnu.org/git/gawk.git"
commit = "027ebff56b83600d88fd303b98c36201116a7560"

[build]
style = "gnu"
# the extra programs of the source tree are not installed
prepare = '''
sed -i 's/extras//' Makefile.am
autoreconf -fiv
sed -i 's/extras//' Makefile.in
'''
