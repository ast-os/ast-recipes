[package]
name = "xsetroot"
description = "X.Org application xsetroot"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11", "libxmu", "xbitmaps", "libxcursor"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/xsetroot"
commit = "ea3de0ef94ca885f7104c9db34efe7e150e28269"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
