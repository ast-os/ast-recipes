[package]
name = "xsetroot"
version = "1.1.4"
description = "X.Org application xsetroot"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11", "libxmu"]

[source]
url = "https://www.x.org/releases/individual/app/xsetroot-1.1.4.tar.xz"
sha256 = "1315a3f7e9abe06357363b93461e272601f67225ce0bc075c430cce35073362b"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
