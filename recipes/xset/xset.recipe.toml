[package]
name = "xset"
version = "1.2.6"
description = "X.Org application xset"
license = "MIT"
arch = ["x86_64"]
depends = ["libxmu", "libx11", "libxext"]

[source]
url = "https://www.x.org/releases/individual/app/xset-1.2.6.tar.xz"
sha256 = "623837349ea887bc003f01ee2e4b6b8ddd9c2774f632c6d70eead1b56306b695"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
