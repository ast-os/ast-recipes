[package]
name = "xset"
description = "X.Org application xset"
license = "MIT"
arch = ["x86_64"]
depends = ["libxmu", "libx11", "libxext"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/xset"
commit = "498f661ca0a725a4750e3e7c091c5752b1a52bd8"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
