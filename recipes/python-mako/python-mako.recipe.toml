[package]
name = "python-mako"
description = "Template library"
license = "MIT"
arch = ["x86_64"]
depends = ["python", "python-markupsafe"]

[source]
git = "https://github.com/sqlalchemy/mako"
commit = "6b833ae06fc8866b89ea7939e5d36dd71699cf05"

[build]
build = '''
true
'''
install = '''
site="$DESTDIR/usr/lib/python3.13/site-packages"
mkdir -p "$site"
cp -r mako "$site/"
'''
