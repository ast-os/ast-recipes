[package]
name = "garcon"
description = "Xfce freedesktop menus"
license = "LGPL-2.0-or-later"
arch = ["x86_64"]
depends = ["gtk+", "libxfce4ui", "libxfce4util"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/garcon"
commit = "16e9e527161aaf09d2756b5e318df58b53116aeb"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--enable-maintainer-mode", "--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
