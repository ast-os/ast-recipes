[package]
name = "exo"
version = "4.20.0"
description = "Xfce application support library"
license = "LGPL-2.1-or-later"
arch = ["x86_64"]
depends = ["gtk+", "libxfce4ui", "libxfce4util"]
build_depends = ["xfce4-dev-tools"]

[source]
git = "https://gitlab.xfce.org/xfce/exo"
commit = "6157f1ba3a9cd1347458c16d90d152d9e4ca4aa9"

[build]
style = "gnu"
prepare = '''
NOCONFIGURE=1 xdt-autogen
'''
configure = ["--enable-maintainer-mode", "--disable-static", "--disable-gtk-doc", "--disable-vala", "--disable-introspection", "--disable-debug"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
# the manual pages are generated from DocBook with its stylesheets, which are not in git: no docs
make = ['SUBDIRS="exo exo-desktop-item-edit exo-open pixmaps po tests"']
install_args = ['SUBDIRS="exo exo-desktop-item-edit exo-open pixmaps po tests"']
