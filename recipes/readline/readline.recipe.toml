[package]
name = "readline"
version = "8.3"
description = "Line editing library"
license = "GPL-3.0-or-later"
arch = ["x86_64"]
depends = ["ncurses"]

[source]
url = "https://ftpmirror.gnu.org/readline/readline-8.3.tar.gz"
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"

[build]
style = "gnu"
configure = ["--disable-static", "--with-curses"]
make = ["SHLIB_LIBS=\"-lncursesw\""]
# no .old copies of the libraries on upgrade, no rpath, and the install of the library names
prepare = '''
sed -i '/MV.*old/d' Makefile.in
sed -i '/{OLDSUFF}/c:' support/shlib-install
sed -i 's/-Wl,-rpath,[^ ]*//' support/shobj-conf
'''
