[package]
name = "curl"
version = "8.23.0"
description = "Transfer data with URLs"
license = "curl"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "pkgconf"]
depends = ["openssl", "zlib", "zstd", "ca-certificates"]

[source]
git = "https://github.com/curl/curl"
commit = "3163ec065643ba20709f190111f42c3e1fe95273"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--with-openssl", "--with-zstd", "--with-ca-bundle=/etc/ssl/certs/ca-certificates.crt", "--without-libpsl", "--without-libidn2", "--without-nghttp2", "--without-brotli", "--disable-ldap", "--disable-docs"]
