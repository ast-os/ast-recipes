[package]
name = "xfce4-dev-tools"
description = "Autotools macros and xdt-autogen of the Xfce projects"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["glib", "gtk-doc", "docbook-xsl"]
build_depends = ["libxslt"]

[source]
git = "https://gitlab.xfce.org/xfce/xfce4-dev-tools"
commit = "127d0abd88f3759fca8f6126460465910d24085d"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
# the manual page of xdt-csource is generated from DocBook, which needs the network: no docs, no tests
make = ['SUBDIRS="helpers m4macros scripts xdt-csource"']
install_args = ['SUBDIRS="helpers m4macros scripts xdt-csource"']
