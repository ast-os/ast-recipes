[package]
name = "xorgproto"
version = "2026.1"
description = "X.Org protocol headers"
license = "MIT"
arch = ["x86_64"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/proto/xorgproto"
commit = "6d3907b6d5dc4aa7d7ee6ee5d7d8714e7466630b"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
