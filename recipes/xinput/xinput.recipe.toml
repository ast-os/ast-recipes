[package]
name = "xinput"
version = "1.6.4"
description = "X.Org application xinput"
license = "MIT"
arch = ["x86_64"]
depends = ["libxi", "libxrandr", "libx11"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/app/xinput"
commit = "b6092488058da39754ece13475aab53616397af7"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
