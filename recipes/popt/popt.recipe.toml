[package]
name = "popt"
description = "Command line option parsing"
license = "MIT"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext"]

[source]
git = "https://github.com/rpm-software-management/popt"
commit = "916e61045d268f7e37ade5ec047eb77e8299e6ad"

[build]
style = "gnu"
prepare = '''
./autogen.sh
'''
configure = ["--disable-static"]
