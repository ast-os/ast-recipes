[package]
name = "wpa_supplicant"
description = "WPA/WPA2/WPA3 supplicant for wifi"
license = "BSD-3-Clause"
arch = ["x86_64"]
depends = ["libnl", "openssl", "dbus", "readline"]
build_depends = ["pkgconf", "make", "gcc"]
config_files = ["/etc/orchid/services/wpa_supplicant.toml"]

[source]
git = "https://git.w1.fi/hostap.git"
commit = "831364bf02710ad09c2f27d3efa92abeeb5634c0"

[build]
prepare = '''
cat > wpa_supplicant/.config <<'CONFIG'
CONFIG_DRIVER_NL80211=y
CONFIG_LIBNL32=y
CONFIG_DRIVER_WIRED=y
CONFIG_CTRL_IFACE=y
CONFIG_CTRL_IFACE_DBUS_NEW=y
CONFIG_CTRL_IFACE_DBUS_INTRO=y
CONFIG_BACKEND=file
CONFIG_TLS=openssl
CONFIG_EAP_MD5=y
CONFIG_EAP_MSCHAPV2=y
CONFIG_EAP_TLS=y
CONFIG_EAP_PEAP=y
CONFIG_EAP_TTLS=y
CONFIG_EAP_GTC=y
CONFIG_EAP_OTP=y
CONFIG_EAP_LEAP=y
CONFIG_PKCS12=y
CONFIG_SMARTCARD=y
CONFIG_IEEE80211W=y
CONFIG_IEEE80211R=y
CONFIG_IEEE80211N=y
CONFIG_IEEE80211AC=y
CONFIG_IEEE80211AX=y
CONFIG_SAE=y
CONFIG_OWE=y
CONFIG_WPS=y
CONFIG_READLINE=y
CONFIG_AP=y
CONFIG_P2P=y
CONFIG_PEERKEY=y
CONFIG_HT_OVERRIDES=y
CONFIG_VHT_OVERRIDES=y
CONFIG_INTERNETWORKING=y
CONFIG_HS20=y
CONFIG_NO_RANDOM_POOL=y
CONFIG_BGSCAN_SIMPLE=y
CONFIG_BGSCAN_LEARN=y
CONFIG_AUTOSCAN_PERIODIC=y
CONFIG_AUTOSCAN_EXPONENTIAL=y
CONFIG_TDLS=y
CONFIG_MESH=y
CONFIG_L2_PACKET=linux
CONFIG_ELOOP=eloop
CONFIG_ELOOP_EPOLL=y
CONFIG_NO_WPA_PASSPHRASE=
CONFIG_DEBUG_FILE=y
CONFIG_DEBUG_SYSLOG=y
CONFIG_WPA_CLI_EDIT=
CONFIG
'''
build = '''
cd wpa_supplicant
make -j"$JOBS" BINDIR=/usr/bin LIBDIR=/usr/lib INCDIR=/usr/include
'''
install = '''
cd wpa_supplicant
make DESTDIR="$DESTDIR" BINDIR=/usr/bin LIBDIR=/usr/lib INCDIR=/usr/include install
install -Dm644 dbus/dbus-wpa_supplicant.conf "$DESTDIR/usr/share/dbus-1/system.d/wpa_supplicant.conf"
install -d "$DESTDIR/usr/share/dbus-1/system-services"
cat > "$DESTDIR/usr/share/dbus-1/system-services/fi.w1.wpa_supplicant1.service" <<'SERVICE'
[D-BUS Service]
Name=fi.w1.wpa_supplicant1
Exec=/usr/bin/wpa_supplicant -u
User=root
SERVICE
install -d "$DESTDIR/etc/orchid/services" "$DESTDIR/etc/wpa_supplicant"
cat > "$DESTDIR/etc/orchid/services/wpa_supplicant.toml" <<'SERVICE'
[service]
description = "wifi supplicant"
exec = ["/usr/bin/wpa_supplicant", "-u", "-s", "-O", "/run/wpa_supplicant"]
needs = ["dbus"]
restart = "on-failure"
SERVICE
'''
