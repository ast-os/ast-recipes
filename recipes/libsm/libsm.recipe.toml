[package]
name = "libsm"
description = "Session management"
license = "MIT"
arch = ["x86_64"]
depends = ["libice", "util-linux"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libSM"
commit = "5f6da959a34bcefc425b6e37462553acf44369a3"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
