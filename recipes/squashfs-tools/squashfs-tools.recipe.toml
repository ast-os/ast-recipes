[package]
name = "squashfs-tools"
version = "4.7.5"
description = "Tools to create and extract squashfs filesystems"
license = "GPL-2.0-or-later"
arch = ["x86_64"]
depends = ["zlib", "xz", "zstd", "lz4"]

[source]
git = "https://github.com/plougher/squashfs-tools"
commit = "708c59ae80853b0845017c33b42e56061cc546cd"

[build]
build = '''
make -C squashfs-tools -j"$JOBS" GZIP_SUPPORT=1 LZO_SUPPORT=0 XZ_SUPPORT=1 ZSTD_SUPPORT=1 LZ4_SUPPORT=1 COMP_DEFAULT=zstd
'''
install = '''
install -d "$DESTDIR/usr/bin"
install -m755 squashfs-tools/mksquashfs squashfs-tools/unsquashfs "$DESTDIR/usr/bin/"
ln -s unsquashfs "$DESTDIR/usr/bin/sqfscat"
ln -s mksquashfs "$DESTDIR/usr/bin/sqfstar"
'''
