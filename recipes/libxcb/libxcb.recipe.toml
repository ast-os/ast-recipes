[package]
name = "libxcb"
description = "X protocol C binding"
license = "MIT"
arch = ["x86_64"]
depends = ["libxau", "libxdmcp", "xcb-proto"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libxcb"
commit = "622152ee42a310876f10602601206954b8d0613e"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc", "--enable-xinput", "--enable-xkb"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
