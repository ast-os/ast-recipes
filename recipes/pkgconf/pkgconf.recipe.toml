[package]
name = "pkgconf"
description = "Compiler flags for libraries"
license = "ISC"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext"]

[source]
git = "https://github.com/pkgconf/pkgconf"
commit = "4fc570f91d9d8d843ab32d2198a5c064538d8ffd"

[build]
style = "gnu"
prepare = '''
./autogen.sh
'''
configure = ["--disable-static"]
fixup = '''
ln -sf pkgconf "$DESTDIR/usr/bin/pkg-config"
'''
