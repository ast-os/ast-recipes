[package]
name = "libdrm"
version = "2.4.134"
description = "Direct rendering manager library"
license = "MIT"
arch = ["x86_64"]
depends = ["libpciaccess"]

[source]
git = "https://gitlab.freedesktop.org/mesa/drm"
commit = "e984d448b8b17aab853369e6c203e53719f46de1"

[build]
style = "meson"
configure = ["-Dintel=enabled", "-Dradeon=enabled", "-Damdgpu=enabled", "-Dnouveau=enabled", "-Dvmwgfx=enabled", "-Dcairo-tests=disabled", "-Dvalgrind=disabled", "-Dman-pages=disabled", "-Dtests=false"]
