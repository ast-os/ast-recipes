[package]
name = "xcb-util"
version = "0.4.1"
description = "XCB utility library xcb-util"
license = "MIT"
arch = ["x86_64"]
depends = ["libxcb"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libxcb-util"
commit = "3a157762578a2e4253a7cb40d2854a3444d5a9df"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
