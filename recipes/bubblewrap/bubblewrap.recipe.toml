[package]
name = "bubblewrap"
version = "0.13.1"
description = "Unprivileged sandboxing tool (ast runs the build scripts in it)"
license = "LGPL-2.0-or-later"
arch = ["x86_64"]
depends = ["libcap"]
build_depends = ["meson", "ninja", "pkgconf"]

[source]
url = "https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz"
sha256 = "0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d"

[build]
style = "meson"
configure = ["-Dselinux=disabled", "-Dman=disabled", "-Dbash_completion=disabled", "-Dzsh_completion=disabled", "-Dtests=false"]
