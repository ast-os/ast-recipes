[package]
name = "gtk+"
version = "3.24.43"
description = "GTK 3 toolkit"
license = "LGPL-2.1-or-later"
arch = ["x86_64"]
depends = ["glib", "cairo", "pango", "gdk-pixbuf", "at-spi2-core", "libepoxy", "libxi", "libxrandr", "libxcursor", "libxfixes", "libxcomposite", "libxdamage", "libxinerama", "libxkbcommon", "shared-mime-info", "hicolor-icon-theme", "fribidi", "mesa"]

[source]
git = "https://gitlab.gnome.org/GNOME/gtk"
commit = "788f4de2799b3f5902d27733ea603e8dfee8d0a6"

[build]
style = "meson"
configure = ["-Dx11_backend=true", "-Dwayland_backend=false", "-Dbroadway_backend=false", "-Dintrospection=false", "-Dprint_backends=file", "-Dcloudproviders=false", "-Dcolord=no", "-Dgtk_doc=false", "-Ddemos=false", "-Dexamples=false", "-Dtests=false"]
