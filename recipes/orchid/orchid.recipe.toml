[package]
name = "orchid"
description = "The init system of asterOS"
license = "BSD-3-Clause"
revision = 11
arch = ["x86_64"]
depends = ["glibc"]
build_depends = ["rust-bin"]
config_files = ["/etc/orchid/services/efivars.toml", "/etc/orchid/services/fsck.toml", "/etc/orchid/services/hwclock.toml", "/etc/orchid/services/loopback.toml", "/etc/orchid/services/mounts.toml", "/etc/orchid/services/random-seed.toml", "/etc/orchid/services/rescue-shell.toml", "/etc/orchid/services/rootfs.toml", "/etc/orchid/services/swap.toml", "/etc/orchid/services/sysctl.toml"]

[source]
git = "https://github.com/ast-os/ast-orchid"
commit = "79fe93ef966f65dd1144b4e0994ace0f383542b7"

[build]
style = "cargo"
install = '''
install -Dm755 target/release/orchid "$DESTDIR/usr/sbin/orchid"
for l in init reboot poweroff halt; do ln -s orchid "$DESTDIR/usr/sbin/$l"; done
install -Dm644 -t "$DESTDIR/etc/orchid/services" data/services/*.toml
'''
