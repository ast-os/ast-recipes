[package]
name = "libxt"
description = "X toolkit intrinsics"
license = "MIT"
arch = ["x86_64"]
depends = ["libsm", "libx11"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXt"
commit = "1dfcfa8dcc3958749849438a802d66728ccf3115"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
