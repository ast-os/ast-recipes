[package]
name = "at-spi2-core"
description = "Accessibility toolkit (atk, at-spi2)"
license = "LGPL-2.1-or-later"
arch = ["x86_64"]
depends = ["dbus", "glib", "libxml2", "libx11", "libxtst", "libxi"]

[source]
git = "https://gitlab.gnome.org/GNOME/at-spi2-core"
commit = "3a214cddffbf345b8c0d0b17e458abbc5ed851b1"

[build]
style = "meson"
configure = ["-Dintrospection=disabled", "-Dx11=enabled", "-Ddocs=false"]
