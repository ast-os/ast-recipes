[package]
name = "libxdmcp"
description = "X display manager control protocol"
license = "MIT"
arch = ["x86_64"]
depends = ["xorgproto"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXdmcp"
commit = "1192d3bc407348ff316bd3bffc791b3ac73f591b"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
