[package]
name = "libxrender"
description = "XRender"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXrender"
commit = "f30d654658ebf17d41141ed3ec2abf607d8a512e"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
