[package]
name = "libxfixes"
version = "6.0.2"
description = "XFIXES"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXfixes"
commit = "70d5b0e37f8a759f3dbc218f22954347ceed094a"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
