[package]
name = "kmod"
version = "34.2"
description = "Kernel module tools"
license = "LGPL-2.1-or-later"
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "pkgconf"]
depends = ["zlib", "xz", "zstd", "openssl"]

[source]
git = "https://git.kernel.org/pub/scm/utils/kernel/kmod/kmod.git"
commit = "13330c958deef15c227a9c83d8ba72106152fd7f"

[build]
style = "meson"
prepare = '''
./autogen.sh
'''
configure = ["-D manpages=false"]
