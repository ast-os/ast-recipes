[package]
name = "libwnck"
description = "Window navigation library"
license = "LGPL-2.0-or-later"
arch = ["x86_64"]
depends = ["gtk+", "libxrender"]

[source]
git = "https://gitlab.gnome.org/GNOME/libwnck"
commit = "75e56cf1d7ef1edd61516bdf25bf7fdee8b935f3"

[build]
style = "meson"
configure = ["-Dintrospection=disabled", "-Dgtk_doc=false", "-Dinstall_tools=true"]
