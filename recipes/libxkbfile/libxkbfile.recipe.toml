[package]
name = "libxkbfile"
version = "1.2.0"
description = "XKB file handling"
license = "MIT"
arch = ["x86_64"]
depends = ["libx11"]

[source]
url = "https://www.x.org/releases/individual/lib/libxkbfile-1.2.0.tar.xz"
sha256 = "7f71884e5faf56fb0e823f3848599cf9b5a9afce51c90982baeb64f635233ebf"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
