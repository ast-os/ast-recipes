[package]
name = "libxaw"
version = "1.0.16"
description = "Athena widgets"
license = "MIT"
arch = ["x86_64"]
depends = ["libxmu", "libxpm", "libxt", "libxext"]

[source]
url = "https://www.x.org/releases/individual/lib/libXaw-1.0.16.tar.xz"
sha256 = "731d572b54c708f81e197a6afa8016918e2e06dfd3025e066ca642a5b8c39c8f"

[build]
style = "gnu"
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
