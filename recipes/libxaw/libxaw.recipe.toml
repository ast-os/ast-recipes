[package]
name = "libxaw"
description = "Athena widgets"
license = "MIT"
arch = ["x86_64"]
depends = ["libxmu", "libxpm", "libxt", "libxext"]
build_depends = ["util-macros"]

[source]
git = "https://gitlab.freedesktop.org/xorg/lib/libXaw"
commit = "f14ba54e9c7e415a05e33dd0b3b5f96e5de05c8b"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--disable-static", "--disable-specs", "--disable-docs", "--without-doxygen", "--without-xmlto", "--without-fop", "--without-xsltproc"]
fixup = '''
find "$DESTDIR" -name "*.la" -delete
'''
