[package]
name = "eudev"
description = "Device manager"
license = "GPL-2.0-or-later"
revision = 2
arch = ["x86_64"]
build_depends = ["autoconf", "automake", "libtool", "gettext", "gperf", "pkgconf"]
config_files = ["/etc/orchid/services/udevd.toml", "/etc/orchid/services/udev-trigger.toml", "/etc/orchid/services/udev-settle.toml"]
depends = ["kmod", "gperf"]

[source]
git = "https://github.com/eudev-project/eudev"
commit = "9e7c4e744b9e7813af9acee64b5e8549ea1fbaa3"

[build]
style = "gnu"
prepare = '''
autoreconf -fiv
'''
configure = ["--bindir=/usr/sbin", "--disable-static", "--disable-manpages", "--enable-kmod"]
fixup = '''
install -d "$DESTDIR/etc/orchid/services"
cat > "$DESTDIR/etc/orchid/services/udevd.toml" <<'SERVICE'
[service]
description = "device manager"
exec = ["/usr/sbin/udevd"]
restart = "on-failure"
SERVICE
cat > "$DESTDIR/etc/orchid/services/udev-trigger.toml" <<'SERVICE'
[service]
description = "load drivers for the devices that are present"
exec = ["/usr/sbin/udevadm", "trigger", "--action=add"]
needs = ["udevd"]
type = "oneshot"
SERVICE
cat > "$DESTDIR/etc/orchid/services/udev-settle.toml" <<'SERVICE'
[service]
description = "wait for the devices"
exec = ["/usr/sbin/udevadm", "settle"]
needs = ["udev-trigger"]
type = "oneshot"
SERVICE
'''
