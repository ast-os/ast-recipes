[package]
name = "bc"
description = "Arbitrary precision calculator"
license = "BSD-2-Clause"
arch = ["x86_64"]

[source]
git = "https://github.com/gavinhoward/bc"
commit = "c8dabac65d39fd527a9264a5e505a99b1d8df3d8"

[build]
build = '''
CC="gcc -std=gnu17" ./configure --prefix=/usr -G -O3 -r
make -j"$JOBS"
'''
install = '''
make DESTDIR="$DESTDIR" install
'''
