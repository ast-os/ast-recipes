[package]
name = "freetype"
description = "Font rendering library"
license = "FTL"
arch = ["x86_64"]
depends = ["zlib", "bzip2", "libpng"]

[source]
git = "https://gitlab.freedesktop.org/freetype/freetype"
commit = "37515cf56ba3349656049edbed89ffc6f6466f2d"

[build]
style = "meson"
configure = ["-Dharfbuzz=disabled", "-Dzlib=system", "-Dbzip2=enabled", "-Dpng=enabled", "-Dbrotli=disabled"]
