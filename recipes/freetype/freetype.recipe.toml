[package]
name = "freetype"
version = "2.15.0"
description = "Font rendering library"
license = "FTL"
arch = ["x86_64"]
depends = ["zlib", "bzip2", "libpng"]

[source]
url = "https://download.savannah.gnu.org/releases/freetype/freetype-2.15.0.tar.xz"
sha256 = "93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5"

[build]
style = "meson"
configure = ["-Dharfbuzz=disabled", "-Dzlib=system", "-Dbzip2=enabled", "-Dpng=enabled", "-Dbrotli=disabled"]
